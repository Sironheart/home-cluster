[env]
TALOSCONFIG = "{{config_root}}/k8s/talos/clusterconfig/talosconfig"
TOPFCONFIG = "{{config_root}}/k8s/talos/topf.yaml"
KUBECONFIG = "{{config_root}}/kubeconfig"

[tasks.talos-secrets]
run = "op inject -f -i {{config_root}}/op-templates/secrets.yaml.tpl -o {{config_root}}/k8s/talos/secrets.yaml"
description = "Uses the op-templates/secrets.yaml.tpl file and injects secrets from 1password"

[tasks.config-gen]
run = """
topf render -o {{config_root}}/k8s/talos/clusterconfig
topf talosconfig > {{config_root}}/k8s/talos/clusterconfig/talosconfig
chmod 600 {{config_root}}/k8s/talos/clusterconfig/talosconfig
"""
description = "Generate machine configs and talosconfig"
depends = ['talos-secrets']

[tasks.kubeconfig]
run = "talosctl kubeconfig -n internal.siron.casa $KUBECONFIG"
description = "Read the kubeconfig via talosctl"

[tasks.init]
depends = ['talos-secrets', 'config-gen']
description = "Setup project for local use"

[tasks.prepare-cluster]
depends = ['kubeconfig', 'install-crds', 'install-required-services']
description = "Install CRDs and basic tools"

[tasks.install-crds]
depends = ['kubeconfig']
run = "helmfile -q template -f bootstrap/helmfile.d/00-crds.yaml | yq ea -e 'select(.kind == \"CustomResourceDefinition\")' | kubectl apply --server-side -f - || true"
description = "Install all CRDs"

[tasks.install-required-services]
depends = ['kubeconfig', 'install-crds']
run = "helmfile sync -f bootstrap/helmfile.d/01-basic-installation.yaml"
description = "Install all required tools to have any running service"

[tasks.check-helm-values]
run = """
KUBE_VERSION="$(yq -er '.kubernetesVersion' k8s/talos/topf.yaml)"
deadvalues scan k8s --fail-on dead --details --workers 2 --kube-version "$KUBE_VERSION"
"""
description = "Scan Flux HelmReleases for dead values"

[tools]
# CI
"github:guarnz/deadvalues" = "0.1.8"
yq = "4.54.1"

# Flux
flux2 = "2.9.6"

# Kubernetes
helm = "4.3.1"
helmfile = "1.8.2"
kubectl = "1.37.1"
kustomize = "5.8.3"

# Talos
talosctl = "1.14.4"
"github:postfinance/topf" = "v0.6.1"
