[env]
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
TALHELPER_SECRETS = "{{config_root}}/talos/talsecret.yaml"
KUBECONFIG = "{{config_root}}/kubeconfig"

[tasks.talos-secrets]
run = "op inject -f -i {{config_root}}/op-templates/talsecret.yaml.tpl -o {{config_root}}/talos/talsecret.yaml"
description = "Uses the op-templates/talsecret.yaml.tpl file and injects secrets from 1password"

[tasks.config-gen]
run = "talhelper genconfig -s {{config_root}}/talos/talsecret.yaml -c {{config_root}}/talos/talconfig.yaml -o {{config_root}}/talos/clusterconfig"
description = "Generate machine configs"
depends = ['talos-secrets']

[tasks.kubeconfig]
run = "talosctl kubeconfig -n internal.siron.casa $KUBECONFIG"
description = "Read the kubeconfig via talosctl"

[tasks.init]
depends = ['talos-secrets', 'config-gen']
description = "Setup project for local use"

[tools]
# Flux
flux2 = "2.7.2"

# Kanidm
"cargo:kanidm_tools" = "1.7.3"

# Kubernetes
cilium-cli = "0.18.7"
helm = "3.19.0"
helmfile = "1.1.7"
kubectl = "1.34.1"
kustomize = "5.7.1"

# Talos
talhelper = "3.0.37"
talos = "1.11.2"
