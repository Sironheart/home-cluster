---
helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true
  createNamespace: true

releases:
  - name: cert-manager
    namespace: cert-manager
    chart: oci://quay.io/jetstack/charts/cert-manager
    version: v1.21.1
    values: ["../../k8s/base/cert-manager/cert-manager/app/helm/values.yaml"]

  - name: 1password-connect
    namespace: onepassword
    chart: oci://ghcr.io/1password/connect
    version: 2.4.1
    values:
      ["../../k8s/base/onepassword/1password-connect/app/helm/values.yaml"]

  - name: external-secrets
    namespace: external-secrets
    chart: oci://ghcr.io/external-secrets/charts/external-secrets
    version: 2.10.0
    values:
      ["../../k8s/base/external-secrets/external-secrets/app/helm/values.yaml"]
    hooks:
      - # Apply cluster secret store
        events: ["postsync"]
        command: kubectl
        args:
          - apply
          - --namespace=external-secrets
          - --server-side
          - --field-manager=kustomize-controller
          - --filename
          - ../../k8s/base/external-secrets/external-secrets/app/clustersecretstore.yaml
          - --wait=true
        showlogs: true
    needs: ["onepassword/1password-connect"]

  - name: flux-operator
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.58.1
    values: ["../../k8s/base/flux-system/flux-operator/app/helm/values.yaml"]
    needs: ["onepassword/1password-connect"]

  - name: flux-instance
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    version: 0.58.1
    values: ["../../k8s/base/flux-system/flux-instance/app/helm/values.yaml"]
    needs: ["flux-system/flux-operator"]
    wait: false
    waitForJobs: false
    disableValidation: true
