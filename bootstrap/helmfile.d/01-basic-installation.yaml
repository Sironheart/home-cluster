---
helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true
  createNamespace: true

releases:
  - name: cilium
    namespace: kube-system
    chart: oci://quay.io/cilium/charts/cilium
    version: 1.19.2
    values: ["../../k8s/base/kube-system/cilium/app/helm/values.yaml"]

  - name: coredns
    namespace: kube-system
    chart: oci://ghcr.io/coredns/charts/coredns
    version: 1.45.2
    values: ["../../k8s/base/kube-system/coredns/app/helm/values.yaml"]
    needs: ["kube-system/cilium"]
