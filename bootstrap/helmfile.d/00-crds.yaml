---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

helmDefaults:
  args:
    - --include-crds
    - --no-hooks
  postRenderer: yq
  postRendererArgs:
    - ea
    - -e
    - select(.kind == "CustomResourceDefinition")

releases:
  - name: cloudflare-dns
    namespace: network
    chart: oci://ghcr.io/home-operations/charts-mirror/external-dns
    version: 1.19.0

  - name: external-secrets
    namespace: external-secrets
    chart: oci://ghcr.io/external-secrets/charts/external-secrets
    version: 0.20.4

  - name: envoy-gateway
    namespace: network
    chart: oci://mirror.gcr.io/envoyproxy/gateway-helm
    version: v1.5.4

  - name: grafana-operator
    namespace: observability
    chart: oci://ghcr.io/grafana/helm-charts/grafana-operator
    version: v5.20.0

  - name: prometheus-operator-crds
    namespace: observability
    chart: oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds
    version: 24.0.1

  - name: victoria-metrics-operator
    namespace: observability
    chart: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-operator
    version: 0.56.1
