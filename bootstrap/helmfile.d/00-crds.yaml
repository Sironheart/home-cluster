---
# This helmfile renders CRD charts. Because Helm 4 runs post-renderers before
# including CRDs, the CRD-only filtering has to happen outside of Helm. Apply
# this file with:
#   helmfile template -f bootstrap/helmfile.d/00-crds.yaml | \
#     yq ea -e 'select(.kind == "CustomResourceDefinition")' | \
#     kubectl apply --server-side -f -

helmDefaults:
  args:
    - --include-crds
    - --no-hooks

releases:
  - name: cloudflare-dns
    namespace: network
    chart: oci://ghcr.io/home-operations/charts-mirror/external-dns
    version: 1.21.1

  - name: envoy-gateway
    namespace: network
    chart: oci://mirror.gcr.io/envoyproxy/gateway-helm
    version: v1.8.3

  - name: grafana-operator
    namespace: observability
    chart: oci://ghcr.io/grafana/helm-charts/grafana-operator
    version: 5.24.0

  - name: prometheus-operator-crds
    namespace: observability
    chart: oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds
    version: 30.0.1

  - name: victoria-metrics-operator
    namespace: observability
    chart: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-operator
    version: 0.67.1
