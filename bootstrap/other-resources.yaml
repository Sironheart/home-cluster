---
# https://kubernetes.io/docs/concepts/configuration/secret/
apiVersion: v1
kind: Secret
metadata:
  name: op-credentials
  namespace: external-secrets
type: Opaque
stringData:
  1password-credentials.json: |-
    op://Home Cluster/1password-connect/credentials-base64
