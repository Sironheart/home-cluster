---
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: onepassword
---
apiVersion: v1
kind: Secret
metadata:
  name: op-credentials
  namespace: onepassword
type: Opaque
stringData:
  1password-credentials.json: |-
    op://Home Cluster/1password-connect/credentials-base64
---
apiVersion: v1
kind: Secret
metadata:
  name: onepassword-token
  namespace: onepassword
stringData:
  token: op://Home Cluster/external-secrets/1password-credentials
