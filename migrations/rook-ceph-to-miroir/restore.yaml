---
# Pinned by kopia identity and snapshot ID: a rebuilt cluster has no Snapshot
# CRs yet, and fromPolicy would silently pick whatever catalog discovery found.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${PVC}-migration
  namespace: ${NS}
spec:
  credentialProjection:
    enabled: true
  policy:
    onMissingSnapshot: Fail
  repository:
    kind: ClusterRepository
    name: nas
  source:
    identity:
      username: ${POLICY}
      hostname: ${NS}
      sourcePath: /pvc/${SOURCE}
      snapshotID: ${SNAPSHOT_ID}
  target:
    pvc:
      name: ${PVC}
      accessModes:
        - ReadWriteOnce
      capacity: ${CAPACITY}
      storageClassName: ${STORAGECLASS:=miroir-replicated}
