---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - certificate.yml
  - connection-url.yaml
patches:
  - target:
      kind: HelmRelease
      group: helm.toolkit.fluxcd.io
      version: v2
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: not-used
      spec:
        values:
          persistence:
            postgres-certs:
              type: secret
              name: "postgres-{{ .Release.Name }}-cert"
              defaultMode: 0440
              globalMounts:
                - path: /var/run/secrets/postgresql
            root-ca:
              type: secret
              name: "root-ca"
              defaultMode: 0440
              globalMounts:
                - path: /var/run/secrets/root-ca
