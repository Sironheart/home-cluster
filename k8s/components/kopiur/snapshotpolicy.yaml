---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: "${APP}"
spec:
  copyMethod: Snapshot
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-miroir}
  staging:
    storageClassName: miroir-staging
    # miroir serves RWX only on replicated volumes.
    accessModes:
      - ReadWriteOnce
  credentialProjection:
    enabled: true
  files:
    ignoreRules: ${KOPIUR_IGNORE_RULES:=[lost+found,.ganesha-recovery]}
  repository:
    kind: ClusterRepository
    name: ${KOPIUR_REPOSITORY:=nas}
  retention:
    keepHourly: 24
    keepDaily: 7
  sources:
    - pvc:
        name: ${KOPIUR_PVC:=${APP}}
