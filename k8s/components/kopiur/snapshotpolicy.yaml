---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: "${APP}"
spec:
  copyMethod: Snapshot
  credentialProjection:
    enabled: true
  files:
    ignoreRules:
      - lost+found
  repository:
    kind: ClusterRepository
    name: ${KOPIUR_REPOSITORY:=nas}
  retention:
    keepHourly: 24
    keepDaily: 7
  sources:
    - pvc:
        name: ${KOPIUR_PVC:=${APP}}
