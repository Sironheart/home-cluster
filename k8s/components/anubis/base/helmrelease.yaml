---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}-anubis
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  interval: 1h
  values:
    defaultExternalSecretStoreRef:
      kind: ClusterSecretStore
      name: onepassword
    externalSecrets:
      key:
        forceRename: ${APP}-anubis
        refreshInterval: 1h
        target:
          name: ${APP}-anubis-key
          deletionPolicy: Retain
        data:
          - secretKey: ED25519_PRIVATE_KEY_HEX
            remoteRef:
              key: anubis-key
              property: private key
    networkpolicies:
      allow-kubelet-probes:
        type: cilium
        forceRename: allow-kubelet-probes
        endpointSelector: {}
        ingress:
          - fromEntities:
              - host
      # This policy selects all endpoints and explicitly keeps both directions default-deny.
      allow-same-namespace:
        type: cilium
        forceRename: allow-same-namespace
        endpointSelector: {}
        enableDefaultDeny:
          ingress: true
          egress: true
        ingress:
          - fromEndpoints:
              - {}
        egress:
          - toEndpoints:
              - {}
      allow-dns:
        type: cilium
        forceRename: allow-dns
        endpointSelector: {}
        egress:
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: kube-system
                  k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
      allow-apiserver:
        type: cilium
        forceRename: allow-apiserver
        endpointSelector: {}
        ingress:
          - fromEntities:
              - kube-apiserver
        egress:
          - toEntities:
              - kube-apiserver
      allow-metrics-scrape:
        type: cilium
        forceRename: allow-metrics-scrape
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: observability
      allow-gateway:
        type: cilium
        forceRename: allow-gateway
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
      allow-world:
        type: cilium
        forceRename: allow-world
        endpointSelector: {}
        egress:
          - toCIDRSet:
              - cidr: 0.0.0.0/0
                except:
                  - 10.244.0.0/16
                  - 10.96.0.0/12
              - cidr: ::/0
                except:
                  - fd00:10:244::/48
                  - fd00:10:96::/112
      allow-postgres:
        type: cilium
        forceRename: allow-postgres
        endpointSelector: {}
        egress:
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: database
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
    controllers:
      anubis:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/techarohq/anubis
              tag: v1.27.0@sha256:8828275668b7bc675679f100970f9714f731388fbbf66ae94de8aca952e3fc4a
            env:
              BIND: ":8080"
              DIFFICULTY: '${ANUBIS_DIFFICULTY:="4"}'
              ED25519_PRIVATE_KEY_HEX:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-anubis-key
                    key: ED25519_PRIVATE_KEY_HEX
              METRICS_BIND: ":9090"
              OG_EXPIRY_TIME: "24h"
              OG_PASSTHROUGH: "true"
              POLICY_FNAME: "/etc/anubis/policy.yaml"
              SERVE_ROBOTS_TXT: "true"
              TARGET: "${ANUBIS_TARGET:=http://${ANUBIS_SERVICE:=${APP}}:${ANUBIS_PORT:=80}}"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - "anubis"
                      - "--healthcheck"
                  initialDelaySeconds: 1
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - "anubis"
                      - "--healthcheck"
                  initialDelaySeconds: 1
                  periodSeconds: 5
            resources:
              requests:
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault

    configMaps:
      policy:
        data:
          policy.yaml: |-
            bots:
              - import: (data)/apps/gitea-rss-feeds.yaml
              - import: (data)/clients/git.yaml
              - import: (data)/clients/docker-client.yaml
              - name: allow-api
                path_regex: ^/api/.*
                action: ALLOW
              - import: (data)/meta/default-config.yaml

    service:
      anubis:
        ports:
          http:
            port: 80
            targetPort: 8080
            protocol: HTTP
          metrics:
            port: 9090
            protocol: HTTP

    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            interval: 30s

    persistence:
      policy:
        type: configMap
        name: ${APP}-anubis
        globalMounts:
          - path: /etc/anubis
            readOnly: true
