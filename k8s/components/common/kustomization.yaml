---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./namespace.yaml
  - ./repos
patches:
  - target:
      kind: HelmRelease
      version: v2
    patch: |-
      - op: add
        path: /spec/interval
        value: 1h
      - op: add
        path: /spec/install
        value:
          crds: CreateReplace
          remediation:
            retries: -1
      - op: add
        path: /spec/upgrade
        value:
          cleanupOnFail: true
          crds: CreateReplace
          remediation:
            retries: 3
