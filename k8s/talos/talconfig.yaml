---
clusterName: home
# renovate: datasource=custom.talos-factory depName=siderolabs/talos
talosVersion: v1.13.8
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.36.3

endpoint: https://internal.siron.casa:6443
allowSchedulingOnControlPlanes: true
cniConfig:
  name: none

additionalApiServerCertSans: &san
  - 127.0.0.1 #KubePrism
  - 192.168.1.11 #Talos01
  - 192.168.1.12 #Talos02
  - 192.168.1.13 #Talos03
  - internal.siron.casa #DNS route to cluster

controlPlane:
  certSANs: *san
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/amdgpu
          # Needed for multi-arch runner
          - siderolabs/binfmt-misc
          - siderolabs/zfs
      extraKernelArgs:
        - amd_iommu=on # PCI Passthrough
        - initcall_blacklist=algif_aead_init # copy.fail fix
        - pcie_aspm=off # Disable PCIe ASPM
        - usbcore.autosuspend=-1 # Disable USB autosuspend
        - sysctl.kernel.kexec_load_disabled=1
        - talos.dashboard.disabled=1
        - zfs.zfs_arc_max=8589934592 # Cap ZFS ARC at 8GiB

nodes:
  - hostname: talos01
    ipAddress: 192.168.1.11
    controlPlane: true
    disableSearchDomain: true

    installDiskSelector: &diskSelector
      model: CT1000P3PSSD8

    machineSpec: &machinespec
      mode: metal
      arch: amd64
      secureboot: false
      useUKI: false

    networkInterfaces: &network
      - deviceSelector:
          physical: true
        dhcp: true

    nodeLabels: &labels
      feature.node.kubernetes.io/amd-gpu: "true"

    userVolumes: &userVolumes
      - name: local-hostpath
        provisioning:
          diskSelector:
            match: system_disk
          grow: false
          minSize: 128GiB
          maxSize: 128GiB
        filesystem:
          type: xfs

    volumes: &volumes
      - name: EPHEMERAL
        provisioning:
          diskSelector:
            match: system_disk
          minSize: 200GiB
          maxSize: 400GiB
          grow: false

  - hostname: talos02
    ipAddress: 192.168.1.12
    controlPlane: true
    disableSearchDomain: true

    installDiskSelector: *diskSelector

    machineSpec: *machinespec

    networkInterfaces: *network

    nodeLabels: *labels

    userVolumes: *userVolumes
    volumes: *volumes

  - hostname: talos03
    ipAddress: 192.168.1.13
    controlPlane: true
    disableSearchDomain: true

    installDiskSelector: *diskSelector

    machineSpec: *machinespec

    networkInterfaces: *network

    nodeLabels: *labels

    userVolumes: *userVolumes
    volumes: *volumes

patches:
  # Reserve the largest system-disk partition for a ZFS pool.
  - |-
    apiVersion: v1alpha1
    kind: RawVolumeConfig
    name: zfs-pool
    provisioning:
      diskSelector:
        match: system_disk
      grow: true
      minSize: 256GiB

  # Enable host dns
  - |-
    machine:
      features:
        apidCheckExtKeyUsage: true
        diskQuotaSupport: true
        hostDNS:
          enabled: true
          resolveMemberNames: true
          forwardKubeDNSToHost: false

  # Wipe disk on install
  - |-
    machine:
      install:
        wipe: true

  # Replace kubeproxy with cilium
  - |-
    cluster:
      proxy:
        disabled: true

  # Dual-stack: pods need IPv6 for egress to IPv6-only public endpoints (e.g. Towonel)
  - |-
    cluster:
      network:
        podSubnets:
          - 10.244.0.0/16
          - fd00:10:244::/48
        serviceSubnets:
          - 10.96.0.0/12
          - fd00:10:96::/112

  - |-
    machine:
      kernel:
        modules:
          - name: binfmt_misc
          - name: zfs

  # Kubelet configuration
  - |-
    machine:
      kubelet:
        disableManifestsDirectory: true
        extraConfig:
          maxPods: 250
          serializeImagePulls: false
          imageGCHighThresholdPercent: 60
          imageGCLowThresholdPercent: 40
          imageMinimumGCAge: "12h" # half a day
          imageMaximumGCAge: "168h" # 7 days
        extraArgs:
          container-log-max-size: "10Mi"
          container-log-max-files: "2"

  # NFS settings
  - |-
    machine:
      files:
      - op: create
        path: /etc/cri/conf.d/20-customization.part
        content: |-
          [plugins]
          [plugins."io.containerd.grpc.v1.cri"]
            enable_unprivileged_ports = true
            enable_unprivileged_icmp = true
          [plugins."io.containerd.cri.v1.images"]
            discard_unpacked_layers = false
          [plugins."io.containerd.cri.v1.runtime"]
            cdi_spec_dirs = ["/var/cdi/static", "/var/cdi/dynamic"]
            device_ownership_from_security_context = true
      - op: overwrite
        path: /etc/nfsmount.conf
        permissions: 0o644
        content: |
          [ NFSMount_Global_Options ]
          nfsvers=4.1
          hard=True
          noatime=True
          nconnect=16

  # Configure cluster
  - |-
    cluster:
      apiServer:
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 3Gi
        extraArgs:
          enable-aggregator-routing: "true"
          feature-gates: MutatingAdmissionPolicy=true
          runtime-config: admissionregistration.k8s.io/v1beta1=true
      controllerManager:
        extraArgs:
          bind-address: 0.0.0.0
      coreDNS:
          disabled: true
      proxy:
        disabled: true
      scheduler:
          config:
            apiVersion: kubescheduler.config.k8s.io/v1
            kind: KubeSchedulerConfiguration
            profiles:
              - pluginConfig:
                  - args:
                      defaultConstraints:
                        - maxSkew: 1
                          topologyKey: kubernetes.io/hostname
                          whenUnsatisfiable: ScheduleAnyway
                      defaultingType: List
                    name: PodTopologySpread
                plugins:
                  score:
                    disabled:
                      - name: ImageLocality
                schedulerName: default-scheduler

  # Etcd metrics
  - |-
    cluster:
      etcd:
        extraArgs:
          listen-metrics-urls: http://0.0.0.0:2381

  # Enable K8s Talos API Access
  - |-
    machine:
      features:
        kubernetesTalosAPIAccess:
          enabled: true
          allowedRoles:
            - os:admin
          allowedKubernetesNamespaces:
            - system-upgrade

  - |-
    cluster:
      apiServer:
        admissionControl:
        - name: PodSecurity
          configuration:
            exemptions:
              namespaces:
                - cert-manager
                - forgejo
                - network
                - observability
                - openebs
                - rook-ceph
                - system

  # Expose kube-scheduler metrics for scraping
  - |-
    cluster:
      scheduler:
        extraArgs:
          bind-address: "0.0.0.0"
