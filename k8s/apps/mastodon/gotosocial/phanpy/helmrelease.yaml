---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: phanpy
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  interval: 30m
  values:
    controllers:
      phanpy:
        containers:
          main:
            image:
              repository: "ghcr.io/jjgadgets/phanpy"
              tag: 2025.01.26.24f03f5
            env:
              PHANPY_WEBSITE: "phanpy.siron.casa"
              PHANPY_DEFAULT_INSTANCE: "gts.siron.casa"
            resources:
              requests:
                cpu: 10m
                memory: 10Mi
              limits:
                memory: 32Mi

    service:
      main:
        controller: phanpy
        ports:
          http:
            port: 8080

    route:
      app:
        parentRefs:
          - name: external
            namespace: network
        hostnames:
          - phanpy.siron.casa
