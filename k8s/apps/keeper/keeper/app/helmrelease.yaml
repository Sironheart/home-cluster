---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app keeper
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    defaultExternalSecretStoreRef:
      kind: ClusterSecretStore
      name: onepassword
    externalSecrets:
      credentials:
        forceRename: keeper
        target:
          name: keeper-secret
          deletionPolicy: Retain
          template:
            data:
              BETTER_AUTH_SECRET: "{{ .better_auth_secret }}"
              ENCRYPTION_KEY: "{{ .encryption_key }}"
              GOOGLE_CLIENT_ID: "{{ .google_client_id }}"
              GOOGLE_CLIENT_SECRET: "{{ .google_client_secret }}"
              MICROSOFT_CLIENT_ID: "{{ .microsoft_client_id }}"
              MICROSOFT_CLIENT_SECRET: "{{ .microsoft_client_secret }}"
        dataFrom:
          - extract:
              key: keeper
    controllers:
      web:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          web:
            image:
              repository: ghcr.io/ridafkih/keeper-web
              tag: 2.31.0
            env:
              PORT: &webPort 3000
              VITE_API_URL: http://keeper-api.keeper.svc.cluster.local:3001
            probes:
              liveness: &webProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *webPort
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *webProbes
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      api:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          api:
            image:
              repository: ghcr.io/ridafkih/keeper-api
              tag: 2.31.0
            env:
              API_PORT: &apiPort 3001
              BETTER_AUTH_URL: https://keeper.siron.casa
              DATABASE_URL: &databaseUrl
                valueFrom:
                  secretKeyRef:
                    name: keeper-postgres
                    key: url
              REDIS_URL: &redisUrl redis://dragonfly-keeper.keeper.svc.cluster.local:6379
              DISABLE_LOCAL_AUTH: "true"
              # Google/Microsoft credentials also enable social sign-in on the public route.
              REGISTRATION_EMAIL_DOMAINS: siron.casa
              OIDC_ISSUER_URL: https://sso.siron.casa/oauth2/openid/keeper-app
              OIDC_PROVIDER_NAME: Kanidm
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: keeper-app-kanidm-oauth2-credentials
                    key: CLIENT_ID
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: keeper-app-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
            envFrom: &envFrom
              - secretRef:
                  name: keeper-secret
            probes:
              liveness: &apiProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *apiPort
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *apiProbes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *apiPort
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
      cron:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          cron:
            image:
              repository: ghcr.io/ridafkih/keeper-cron
              tag: 2.31.0
            env:
              DATABASE_URL: *databaseUrl
              REDIS_URL: *redisUrl
              WORKER_JOB_QUEUE_ENABLED: "true"
            envFrom: *envFrom
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
      worker:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          worker:
            image:
              repository: ghcr.io/ridafkih/keeper-worker
              tag: 2.31.0
            env:
              DATABASE_URL: *databaseUrl
              REDIS_URL: *redisUrl
            envFrom: *envFrom
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        # The entrypoints exec keeper-otelemetry, which the images link under /root (mode 0700).
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile: { type: RuntimeDefault }
    service:
      web:
        controller: web
        ports:
          http:
            port: *webPort
      api:
        controller: api
        ports:
          http:
            port: *apiPort
    route:
      keeper:
        hostnames: ["{{ .Release.Name }}.siron.casa"]
        parentRefs:
          - name: external
            namespace: network
        rules:
          - backendRefs:
              - identifier: web
                port: *webPort
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
