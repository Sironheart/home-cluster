---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memini
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    controllers:
      memini:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          memini:
            image:
              repository: registry.erwanleboucher.dev/eleboucher/memini
              # renovate: datasource=docker depName=registry.erwanleboucher.dev/eleboucher/memini
              tag: 0.7.20
            env:
              MEMINI_BACKEND: postgres
              MEMINI_POSTGRES_DSN:
                valueFrom:
                  secretKeyRef:
                    name: memini-postgres
                    key: url
              MEMINI_EMBED_BASE_URL: http://memini-llamacpp:80/v1
              MEMINI_EMBED_MODEL: bge-m3
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_METRICS_ADDR: ":9090"
              MEMINI_DEFAULT_NAMESPACE: default
              MEMINI_REEMBED_ON_MODEL_CHANGE: true
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 15
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8080
                  initialDelaySeconds: 3
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 2Gi
      llamacpp:
        initContainers:
          model-init:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              # renovate: datasource=docker depName=ghcr.io/ggml-org/llama.cpp
              tag: server-vulkan-b5350
            command:
              - /bin/sh
              - -c
              - >-
                [ -f /data/bge-m3-Q8_0.gguf ] ||
                curl -fsSL --retry 5 -o /data/bge-m3-Q8_0.gguf
                https://huggingface.co/gpustack/bge-m3-GGUF/resolve/main/bge-m3-Q8_0.gguf
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          llamacpp:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              # renovate: datasource=docker depName=ghcr.io/ggml-org/llama.cpp
              tag: server-vulkan-b5350
            args:
              - --embeddings
              - --pooling
              - cls
              - -m
              - /data/bge-m3-Q8_0.gguf
              - --host
              - 0.0.0.0
              - --port
              - "80"
              - --alias
              - bge-m3
              - -ngl
              - "99"
              - --ctx-size
              - "8192"
              - --parallel
              - "2"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 80
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 80
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 80
                  periodSeconds: 10
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
                amd.com/gpu: 1
              limits:
                memory: 2Gi
                amd.com/gpu: 1

    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      memini:
        controller: memini
        ports:
          http: { port: &port 8080 }
          metrics: { port: &metricsPort 9090 }
      llamacpp:
        controller: llamacpp
        ports:
          http: { port: 80 }

    serviceMonitor:
      memini:
        enabled: true
        serviceName: memini
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s

    route:
      memini:
        hostnames:
          - memini.siron.casa
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      model-cache:
        existingClaim: *app
        advancedMounts:
          llamacpp:
            model-init:
              - path: /data
            llamacpp:
              - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
