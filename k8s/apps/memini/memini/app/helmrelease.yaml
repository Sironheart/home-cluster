---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memini
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    controllers:
      memini:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          memini:
            image:
              repository: registry.erwanleboucher.dev/eleboucher/memini
              # renovate: datasource=docker depName=registry.erwanleboucher.dev/eleboucher/memini
              tag: 0.7.21
            env:
              MEMINI_BACKEND: postgres
              MEMINI_POSTGRES_DSN:
                valueFrom:
                  secretKeyRef:
                    name: memini-postgres
                    key: url
              MEMINI_EMBED_BASE_URL: http://ollama.ollama.svc.cluster.local:11434/v1
              MEMINI_EMBED_MODEL: bge-m3
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_METRICS_ADDR: ":9090"
              MEMINI_DEFAULT_NAMESPACE: default
              MEMINI_REEMBED_ON_MODEL_CHANGE: true
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 15
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8080
                  initialDelaySeconds: 3
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      memini:
        controller: memini
        ports:
          http: { port: &port 8080 }
          metrics: { port: &metricsPort 9090 }

    serviceMonitor:
      memini:
        enabled: true
        serviceName: memini
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s

    route:
      memini:
        hostnames:
          - memini.siron.casa
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
