---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memini
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  upgrade:
    # Chart migration renamed the controller (memini -> main), which changes the
    # immutable Deployment selector. Removable once the rollout has completed.
    force: true
  values:
    controllers:
      main:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          main:
            env:
              MEMINI_BACKEND: postgres
              # Chart default moves the UI to :8081, which no route exposes.
              # Empty serves it on the main port, as before the chart migration.
              MEMINI_UI_ADDR: ""
              MEMINI_POSTGRES_DSN:
                valueFrom:
                  secretKeyRef:
                    name: memini-postgres
                    key: url
              MEMINI_EMBED_BASE_URL: http://ollama.ollama.svc.cluster.local:11434/v1
              MEMINI_EMBED_MODEL: bge-m3
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_REEMBED_ON_MODEL_CHANGE: true
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 2Gi

    persistence:
      data:
        enabled: false
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    serviceMonitor:
      main:
        enabled: true

    grafanaDashboards:
      enabled: true

    route:
      main:
        enabled: true
        hostnames:
          - memini.siron.casa
        parentRefs:
          - name: internal
            namespace: network
