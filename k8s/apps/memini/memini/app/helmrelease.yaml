---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memini
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  upgrade:
    # Chart migration renamed the controller (memini -> main), which changes the
    # immutable Deployment selector. Removable once the rollout has completed.
    force: true
  values:
    controllers:
      main:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          main:
            env:
              MEMINI_BACKEND: postgres
              # Chart default moves the UI to :8081, which no route exposes.
              # Empty serves it on the main port, as before the chart migration.
              MEMINI_UI_ADDR: ""
              MEMINI_POSTGRES_DSN:
                valueFrom:
                  secretKeyRef:
                    name: memini-postgres
                    key: url
              MEMINI_EMBED_BASE_URL: https://api.openai.com/v1
              MEMINI_EMBED_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-openai-secret
                    key: MEMINI_EMBED_API_KEY
              MEMINI_EMBED_MODEL: text-embedding-3-small
              MEMINI_EMBED_DIMS: "1536"
              # Serialize OpenAI requests to stay below project rate limits.
              MEMINI_EMBED_MAX_CONCURRENCY: "1"
              # Give rate-limit retries more time before a write is marked for
              # asynchronous repair.
              MEMINI_WRITE_EMBED_TIMEOUT: 30s
              MEMINI_BACKGROUND_EMBED_TIMEOUT: 2m
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 2Gi

    persistence:
      data:
        enabled: false
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    serviceMonitor:
      main:
        enabled: true

    grafanaDashboards:
      enabled: true

    route:
      main:
        enabled: true
        hostnames:
          - memini.siron.casa
        parentRefs:
          - name: internal
            namespace: network
