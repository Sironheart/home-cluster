---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app teamcity
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      teamcity:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
            command:
              - sh
              - -c
              - |
                set -eu
                mkdir -p /data/teamcity_server/datadir/config
                cp /var/run/secrets/postgresql/tls.crt /var/run/secrets/postgresql-runtime/tls.crt
                cp /var/run/secrets/postgresql/tls.key /var/run/secrets/postgresql-runtime/tls.key
                chmod 0400 /var/run/secrets/postgresql-runtime/tls.key
                cat > /data/teamcity_server/datadir/config/database.properties <<EOF
                connectionUrl=jdbc:postgresql://$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?sslmode=verify-full&sslcert=/var/run/secrets/postgresql-runtime/tls.crt&sslkey=/var/run/secrets/postgresql-runtime/tls.key&sslrootcert=$${DB_SSL_CA}
                connectionProperties.user=$${DB_USER}
                EOF
            env:
              - name: DB_HOST
                valueFrom:
                  secretKeyRef:
                    name: teamcity-postgres
                    key: host
              - name: DB_PORT
                valueFrom:
                  secretKeyRef:
                    name: teamcity-postgres
                    key: port
              - name: DB_NAME
                valueFrom:
                  secretKeyRef:
                    name: teamcity-postgres
                    key: db_name
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    name: teamcity-postgres
                    key: user
              - name: DB_SSL_CA
                valueFrom:
                  secretKeyRef:
                    name: teamcity-postgres
                    key: ssl_ca
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
        containers:
          teamcity:
            image:
              repository: jetbrains/teamcity-server
              tag: 2026.1.2-linux@sha256:a961642badea63b919d134af686e5bc32142c3a8057e2dbf1a684720a29872d7
            env:
              TEAMCITY_SERVER_MEM_OPTS: "-Xmx2g -XX:ReservedCodeCacheSize=640m"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /login.html
                    port: &port 8111
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /login.html
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /login.html
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 3Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      teamcity:
        controller: teamcity
        ports:
          http:
            port: *port

    route:
      teamcity:
        hostnames:
          - teamcity.siron.casa
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: teamcity
                port: *port

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data/teamcity_server/datadir

      logs:
        type: emptyDir
        globalMounts:
          - path: /opt/teamcity/logs
      postgresql-runtime:
        type: emptyDir
        globalMounts:
          - path: /var/run/secrets/postgresql-runtime
