---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sable
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    controllers:
      sable:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: git.sable.moe/sableclient/sable-next
              tag: 26.11.4
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /config.json, port: 8080 }
                  periodSeconds: 30
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
    persistence:
      config:
        type: configMap
        name: sable-config
        advancedMounts:
          sable:
            app:
              - path: /app/config.json
                subPath: config.json
                readOnly: true
      # caddy autosaves its active config to XDG_CONFIG_HOME and keeps runtime assets in XDG_DATA_HOME
      caddy-config:
        type: emptyDir
        advancedMounts:
          sable:
            app:
              - path: /config
      caddy-data:
        type: emptyDir
        advancedMounts:
          sable:
            app:
              - path: /data
    service:
      app:
        controller: sable
        ports:
          http:
            port: &port 8080
    route:
      app:
        hostnames: ["sable.siron.casa"]
        parentRefs:
          - name: external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
