[global]
server_name = "matrix.siron.casa"
address = ["::"]
port = 8080

database_path = "/data"

rocksdb_compression_algo = "zstd"

allow_encryption = true
allow_federation = true
allow_registration = false

url_preview_url_contains_allowlist = ["*"]
require_auth_for_profile_requests = true
allow_public_room_directory_over_federation = false
lockdown_public_room_directory = true

admins_list = ["@sironheart:matrix.siron.casa"]

# remote media cache has no built-in retention; purge on startup so the volume stays bounded
admin_execute = ["media delete-past-remote-media -b 30d"]
admin_execute_errors_ignore = true

registration_token = "{{ .registration_token }}"
emergency_password = "{{ .emergency_password }}"

[global.well_known]
client = "https://matrix.siron.casa"
server = "matrix.siron.casa:443"

# delegated auth implies oauth compatibility_mode "exclusive": legacy password
# login is disabled, clients must support native OIDC (Element family does)
[global.oauth.oidc]
discovery_url = "https://sso.siron.casa/oauth2/openid/continuwuity"
client_id = "continuwuity"
client_secret_file = "/etc/continuwuity/oidc_secret"
additional_scopes = ["email", "profile"]
prompt_for_localpart = false
profile_key_import_mode = "on_registration"
profile_key_map = { displayname = "name" }
