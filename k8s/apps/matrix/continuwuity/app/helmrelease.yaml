---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app continuwuity
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    defaultExternalSecretStoreRef:
      kind: ClusterSecretStore
      name: onepassword
    externalSecrets:
      config:
        forceRename: continuwuity
        target:
          name: continuwuity
          deletionPolicy: Retain
          template:
            templateFrom:
              - configMap:
                  name: continuwuity-config
                  items:
                    - key: continuwuity.toml
        dataFrom:
          - extract:
              key: continuwuity
    networkpolicies:
      allow-kubelet-probes:
        type: cilium
        forceRename: allow-kubelet-probes
        endpointSelector: {}
        ingress:
          - fromEntities:
              - host
      # This policy selects all endpoints and explicitly keeps both directions default-deny.
      allow-same-namespace:
        type: cilium
        forceRename: allow-same-namespace
        endpointSelector: {}
        enableDefaultDeny:
          ingress: true
          egress: true
        ingress:
          - fromEndpoints:
              - {}
        egress:
          - toEndpoints:
              - {}
      allow-dns:
        type: cilium
        forceRename: allow-dns
        endpointSelector: {}
        egress:
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: kube-system
                  k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
      allow-apiserver:
        type: cilium
        forceRename: allow-apiserver
        endpointSelector: {}
        ingress:
          - fromEntities:
              - kube-apiserver
        egress:
          - toEntities:
              - kube-apiserver
      allow-metrics-scrape:
        type: cilium
        forceRename: allow-metrics-scrape
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: observability
      allow-gateway:
        type: cilium
        forceRename: allow-gateway
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
      allow-world:
        type: cilium
        forceRename: allow-world
        endpointSelector: {}
        egress:
          - toCIDRSet:
              - cidr: 0.0.0.0/0
                except:
                  - 10.244.0.0/16
                  - 10.96.0.0/12
              - cidr: ::/0
                except:
                  - fd00:10:244::/48
                  - fd00:10:96::/112
    controllers:
      continuwuity:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: forgejo.ellis.link/continuwuation/continuwuity
              tag: v26.9.0
            env:
              CONTINUWUITY_CONFIG: /etc/continuwuity/continuwuity.toml
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket: { port: 8080 }
                  periodSeconds: 15
                  failureThreshold: 6
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket: { port: 8080 }
                  periodSeconds: 5
                  failureThreshold: 120
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: *app
        advancedMounts:
          continuwuity:
            app:
              - path: /data
      config:
        type: secret
        name: continuwuity
        advancedMounts:
          continuwuity:
            app:
              - path: /etc/continuwuity/continuwuity.toml
                subPath: continuwuity.toml
                readOnly: true
      oidc-secret:
        type: secret
        name: continuwuity-kanidm-oauth2-credentials
        advancedMounts:
          continuwuity:
            app:
              - path: /etc/continuwuity/oidc_secret
                subPath: CLIENT_SECRET
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          continuwuity:
            app:
              - path: /tmp
    service:
      app:
        controller: continuwuity
        ports:
          http:
            port: &port 8080
    route:
      app:
        hostnames: ["matrix.siron.casa"]
        parentRefs:
          - name: external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
