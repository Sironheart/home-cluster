---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app continuwuity
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    controllers:
      continuwuity:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: forgejo.ellis.link/continuwuation/continuwuity
              tag: v26.8.1
            env:
              CONTINUWUITY_CONFIG: /etc/continuwuity/continuwuity.toml
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket: { port: 8080 }
                  periodSeconds: 15
                  failureThreshold: 6
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket: { port: 8080 }
                  periodSeconds: 5
                  failureThreshold: 120
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: *app
        advancedMounts:
          continuwuity:
            app:
              - path: /data
      config:
        type: secret
        name: continuwuity
        advancedMounts:
          continuwuity:
            app:
              - path: /etc/continuwuity/continuwuity.toml
                subPath: continuwuity.toml
                readOnly: true
      oidc-secret:
        type: secret
        name: continuwuity-kanidm-oauth2-credentials
        advancedMounts:
          continuwuity:
            app:
              - path: /etc/continuwuity/oidc_secret
                subPath: CLIENT_SECRET
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          continuwuity:
            app:
              - path: /tmp
    service:
      app:
        controller: continuwuity
        ports:
          http:
            port: &port 8080
    route:
      app:
        hostnames: ["matrix.siron.casa"]
        parentRefs:
          - name: external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
