---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app continuwuity
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
    - ../../../../components/netpol
    - ../../../../components/netpol-gateway
    - ../../../../components/netpol-world
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: matrix
  interval: 1h
  path: ./k8s/apps/matrix/continuwuity/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 15Gi
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
