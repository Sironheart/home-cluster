---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: immich-app
spec:
  displayname: Immich
  kanidmRef:
    name: sso
    namespace: sso
  origin: https://immich.siron.casa/
  redirectUrl:
    - https://immich.siron.casa/auth/login
    - https://immich.siron.casa/user-settings
    - app.immich:///oauth-callback
  scopeMap:
    - group: immich
      scopes:
        - openid
        - profile
        - email
  secretTemplate:
    labels:
      reconcile.fluxcd.io/watch: Enabled
---
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: immich
spec:
  kanidmRef:
    name: sso
    namespace: sso
  accountPolicy:
    authSessionExpiry: 2678400
  members:
    - sironheart
