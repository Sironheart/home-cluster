---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: immich-app
spec:
  displayname: Immich
  kanidmRef:
    name: sso
    namespace: sso
  origin: https://immich.siron.casa/
  image:
    url: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/immich.svg
  redirectUrl:
    - https://immich.siron.casa/auth/login
    - https://immich.siron.casa/user-settings
    - app.immich:///oauth-callback
  scopeMap:
    - group: immich
      scopes:
        - openid
        - profile
        - email
  claimMap:
    # Immich only accepts a plain string ("admin" or "user"), not an array.
    - name: immich_role
      joinStrategy: csv
      valuesMap:
        - group: immich-admin
          values: [admin]
  secretTemplate:
    labels:
      reconcile.fluxcd.io/watch: Enabled
---
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: immich
spec:
  kanidmRef:
    name: sso
    namespace: sso
  accountPolicy:
    authSessionExpiry: 2678400
  members:
    - immich-admin
---
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: immich-admin
spec:
  kanidmRef:
    name: sso
    namespace: sso
  accountPolicy:
    authSessionExpiry: 2678400
  members:
    - sironheart
