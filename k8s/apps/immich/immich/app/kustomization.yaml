---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./networkpolicies.yaml
  - ./oauth-app.yaml
patches:
  # The shared database component's mounts belong only on the Immich server.
  - target:
      kind: HelmRelease
    patch: |-
      - op: move
        from: /spec/values/persistence
        path: /spec/values/server/persistence
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
