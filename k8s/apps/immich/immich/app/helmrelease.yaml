---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  valuesFrom:
    - kind: Secret
      name: immich-app-kanidm-oauth2-credentials
      valuesKey: CLIENT_ID
      targetPath: immich.configuration.oauth.clientId
      literal: true
    - kind: Secret
      name: immich-app-kanidm-oauth2-credentials
      valuesKey: CLIENT_SECRET
      targetPath: immich.configuration.oauth.clientSecret
      literal: true
  values:
    controllers:
      # Lookup keys are hard-coded by the chart; nameOverride sets container names.
      main:
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
              tag: v3.4.1
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL] }
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    immich:
      configurationKind: Secret
      configuration:
        # CNPG barman-cloud already covers this database with offsite PITR.
        backup:
          database:
            enabled: false
        ffmpeg:
          targetVideoCodec: hevc
          acceptedVideoCodecs: [h264, hevc]
          targetResolution: "1080"
          crf: 28
          preset: fast
        metadata:
          faces:
            import: true
        newVersionCheck:
          enabled: false
        passwordLogin:
          enabled: false
        oauth:
          enabled: true
          issuerUrl: https://sso.siron.casa/oauth2/openid/immich-app
          signingAlgorithm: ES256
          tokenEndpointAuthMethod: client_secret_basic
          buttonText: Login with Kanidm
      persistence:
        library:
          existingClaim: *app
    server:
      controllers:
        main:
          annotations:
            reloader.stakater.com/auto: "true"
          containers:
            main:
              nameOverride: immich
              env:
                IMMICH_ALLOW_SETUP: "false"
                IMMICH_LOG_FORMAT: json
                # The default also trusts LAN ranges, which lets LAN clients spoof X-Forwarded-For.
                IMMICH_TRUSTED_PROXIES: 10.244.0.0/16,fd00:10:244::/48
                DB_URL:
                  valueFrom:
                    secretKeyRef:
                      name: immich-postgres
                      key: url
                REDIS_HOSTNAME: dragonfly-immich
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 4Gi
      route:
        immich:
          forceRename: immich
          hostnames: [immich.siron.casa]
          parentRefs:
            - name: external
              namespace: network
              sectionName: https
          rules:
            - backendRefs:
                - identifier: main
                  port: 2283
              timeouts:
                request: 600s
                backendRequest: 600s
    machine-learning:
      controllers:
        main:
          # Release the GPU before starting the replacement pod.
          strategy: Recreate
          pod:
            # Replaces defaultPodOptions.securityContext instead of merging with it.
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch
              supplementalGroups: [44]
              seccompProfile: { type: RuntimeDefault }
          containers:
            main:
              nameOverride: machine-learning
              image:
                # renovate: datasource=docker depName=ghcr.io/immich-app/immich-machine-learning
                tag: v3.4.1-rocm
              env:
                # Radeon 780M (gfx1103) compatibility with the ROCm image's kernels.
                HSA_OVERRIDE_GFX_VERSION: "11.0.0"
                # Immich ROCm docs: needed on some GPUs when the override alone fails.
                HSA_USE_SVM: "0"
              resources:
                requests:
                  cpu: 500m
                  memory: 6Gi
                limits:
                  memory: 12Gi
                  amd.com/gpu: 1
