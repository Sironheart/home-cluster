---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app atuin
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    controllers:
      atuin:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          atuin:
            image:
              repository: ghcr.io/atuinsh/atuin
              tag: 18.20.0@sha256:9d8b99bfcd5c457b86ef694ec839d61efa5da536e18d05dab3becb99b32fa630
            env:
              ATUIN_HOST: 0.0.0.0
              ATUIN_PORT: &port 80
              ATUIN_OPEN_REGISTRATION: "false"
              ATUIN_METRICS__ENABLE: "true"
              ATUIN_METRICS__HOST: 0.0.0.0
              ATUIN_METRICS__PORT: &metricsPort 8080
              ATUIN_TLS__ENABLE: "false"
              # 18.19+ native-tls/sqlx only loads first PEM from sslrootcert
              SSL_CERT_FILE: /var/run/secrets/root-ca/ca.crt
              ATUIN_DB_URI:
                valueFrom:
                  secretKeyRef:
                    name: atuin-postgres
                    key: url
            args: ["start"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 20Mi
              limits:
                memory: 256Mi

    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      atuin:
        controller: atuin
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort

    serviceMonitor:
      atuin:
        enabled: true
        serviceName: atuin
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s

    route:
      atuin:
        hostnames:
          - sh.siron.casa
        parentRefs:
          - name: external
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      config:
        enabled: true
        type: emptyDir
