---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app papra
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    controllers:
      papra:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          papra:
            image:
              repository: ghcr.io/papra-hq/papra
              # renovate: datasource=docker depName=ghcr.io/papra-hq/papra
              tag: 26.6.1-rootless
            env:
              APP_BASE_URL: https://papra.siron.casa
              DOCUMENT_STORAGE_DRIVER: filesystem
              DOCUMENT_STORAGE_FILESYSTEM_ROOT: /app/app-data/documents
              PORT: &port 1221
            envFrom:
              - secretRef:
                  name: papra-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      papra:
        controller: papra
        ports:
          http:
            port: *port
    route:
      papra:
        hostnames: ["{{ .Release.Name }}.siron.casa"]
        parentRefs:
          - name: external
            namespace: network
        rules:
          - backendRefs:
              - identifier: papra
                port: *port
    persistence:
      app-data:
        existingClaim: *app
        globalMounts:
          - path: /app/app-data
