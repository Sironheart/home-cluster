---
apiVersion: source.toolkit.fluxcd.io/v2
kind: HelmRepository
metadata:
  name: ollama
spec:
  interval: 1h
  url: https://helm.otwld.com/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
spec:
  interval: 1h
  chart:
    spec:
      chart: ollama
      version: 1.29.0
      sourceRef:
        kind: HelmRepository
        name: ollama
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    ollama:
      models:
        pull:
          - gemma3:4b
          - llava:7b
