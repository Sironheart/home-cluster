---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app karakeep
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      karakeep:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          karakeep:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.32.0
            env:
              BROWSER_CONNECT_ONDEMAND: true
              BROWSER_WEBSOCKET_URL: ws://karakeep-chrome.karakeep.svc.cluster.local:3000/chrome?token=karakeep
              CRAWLER_DOWNLOAD_BANNER_IMAGE: true
              CRAWLER_ENABLE_ADBLOCKER: true
              CRAWLER_STORE_SCREENSHOT: true
              DISABLE_PASSWORD_AUTH: true
              DISABLE_SIGNUPS: true
              DATA_DIR: /data
              MEILI_ADDR: http://karakeep-meilisearch.karakeep.svc.cluster.local:7700
              DISABLE_NEW_RELEASE_CHECK: true
              COREPACK_INTEGRITY_KEYS: 0
              OPENAI_BASE_URL: http://ollama.ollama.svc.cluster.local:11434/v1
              OPENAI_API_KEY: ollama
              OLLAMA_KEEP_ALIVE: "15m"
              INFERENCE_TEXT_MODEL: mistral:instruct
              INFERENCE_IMAGE_MODEL: ''
              INFERENCE_JOB_TIMEOUT_SEC: 120
              NEXTAUTH_URL: "https://karakeep.siron.casa"
              OAUTH_PROVIDER_NAME: kanidm
              OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: true
              OAUTH_WELLKNOWN_URL: https://sso.siron.casa/oauth2/openid/karakeep-app/.well-known/openid-configuration
              OAUTH_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-app-kanidm-oauth2-credentials
                    key: CLIENT_ID
              OAUTH_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-app-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
            envFrom:
              - secretRef:
                  name: karakeep-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 165m
                memory: 420Mi
              limits:
                memory: 721Mi

      chrome:
        pod:
          securityContext:
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
        containers:
          chrome:
            image:
              repository: ghcr.io/browserless/chrome
              tag: v2.54.2
            env:
              CONCURRENT: 1
              ENABLE_DEBUGGER: false
              HEALTH: true
              HOST: 0.0.0.0
              QUEUED: 5
              TIMEOUT: 120000
              TOKEN: karakeep
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi

      meilisearch:
        containers:
          meilisearch:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.49.0
            args:
              - /bin/meilisearch
              - --experimental-dumpless-upgrade
            env:
              MEILI_NO_ANALYTICS: true
            envFrom:
              - secretRef:
                  name: karakeep-secret
            resources:
              requests:
                cpu: 10m
                memory: 70Mi
              limits:
                memory: 800Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    route:
      karakeep:
        hostnames: ["{{ .Release.Name }}.siron.casa"]
        parentRefs:
          - name: external
            namespace: network
        rules:
          - backendRefs:
              - identifier: karakeep
                port: &port 3000
    persistence:
      chrome-shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          chrome:
            chrome:
              - path: /dev/shm
      data:
        existingClaim: *app
        advancedMounts:
          karakeep:
            karakeep:
              - path: /data
                subPath: karakeep
          meilisearch:
            meilisearch:
              - path: /meili_data
                subPath: meilisearch
    service:
      karakeep:
        controller: karakeep
        ports:
          http:
            port: *port
      chrome:
        controller: chrome
        ports:
          http:
            port: 3000
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700
