---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app karakeep
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      karakeep:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          karakeep:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.33.2
            env:
              BROWSER_WEB_URL: http://karakeep-chrome.karakeep.svc.cluster.local:9222
              CRAWLER_DOWNLOAD_BANNER_IMAGE: true
              CRAWLER_ENABLE_ADBLOCKER: true
              CRAWLER_STORE_SCREENSHOT: true
              DISABLE_PASSWORD_AUTH: true
              DISABLE_SIGNUPS: true
              DATA_DIR: /data
              MEILI_ADDR: http://karakeep-meilisearch.karakeep.svc.cluster.local:7700
              DISABLE_NEW_RELEASE_CHECK: true
              COREPACK_INTEGRITY_KEYS: 0
              OPENAI_BASE_URL: https://opencode.ai/zen/go/v1
              INFERENCE_TEXT_MODEL: deepseek-v4-pro
              INFERENCE_IMAGE_MODEL: mimo-v2-omni
              INFERENCE_OUTPUT_SCHEMA: json
              INFERENCE_JOB_TIMEOUT_SEC: 120
              OPENAI_TIMEOUT_SEC: 120
              OCR_CACHE_DIR: /data/ocr-cache
              EMBEDDING_ENABLE_AUTO_INDEXING: "false"
              NEXTAUTH_URL: "https://karakeep.siron.casa"
              OAUTH_PROVIDER_NAME: kanidm
              OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: true
              OAUTH_WELLKNOWN_URL: https://sso.siron.casa/oauth2/openid/karakeep-app/.well-known/openid-configuration
              OAUTH_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-app-kanidm-oauth2-credentials
                    key: CLIENT_ID
              OAUTH_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-app-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
            envFrom:
              - secretRef:
                  name: karakeep-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 165m
                memory: 420Mi
              limits:
                memory: 1024Mi

      chrome:
        containers:
          chrome:
            image:
              repository: docker.io/chromedp/headless-shell
              tag: 152.0.7939.3
            args:
              - --hide-scrollbars
              - --disable-gpu
            securityContext:
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi

      meilisearch:
        containers:
          meilisearch:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.53.1
            args:
              - /bin/meilisearch
              - --upgrade-db
            env:
              MEILI_NO_ANALYTICS: true
              MEILI_MAX_INDEXING_MEMORY: 512MB
            envFrom:
              - secretRef:
                  name: karakeep-secret
            resources:
              requests:
                cpu: 10m
                memory: 70Mi
              limits:
                memory: 800Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    route:
      karakeep:
        hostnames: ["{{ .Release.Name }}.siron.casa"]
        parentRefs:
          - name: external
            namespace: network
        rules:
          - backendRefs:
              - identifier: karakeep
                port: &port 3000
    persistence:
      chrome-shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          chrome:
            chrome:
              - path: /dev/shm
      data:
        existingClaim: *app
        advancedMounts:
          karakeep:
            karakeep:
              - path: /data
                subPath: karakeep
          meilisearch:
            meilisearch:
              - path: /meili_data
                subPath: meilisearch
    service:
      karakeep:
        controller: karakeep
        ports:
          http:
            port: *port
      chrome:
        controller: chrome
        ports:
          http:
            port: 9222
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700
