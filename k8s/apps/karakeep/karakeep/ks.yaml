---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app karakeep
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: miroir-storage
      namespace: miroir-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: karakeep
  interval: 1h
  path: ./k8s/apps/karakeep/karakeep/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_IGNORE_RULES: '[lost+found, .ganesha-recovery, "meilisearch/**"]'
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_ACCESSMODES: ReadWriteMany
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
