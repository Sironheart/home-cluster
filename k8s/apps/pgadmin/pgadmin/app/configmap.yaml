---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-config
data:
  config_local.py: |
    import os

    AUTHENTICATION_SOURCES = ['oauth2']
    MASTER_PASSWORD_REQUIRED = False
    # setup.py runs before the entrypoint writes config_distro.py; the default
    # /var/log/pgadmin is not writable with a read-only root filesystem.
    LOG_FILE = '/dev/null'

    # pgAdmin prompts for a password unless the server uses a service; the
    # pgadmin role authenticates by client certificate only.
    SERVER_MODE_ALLOWED_SERVICES = ['home']

    # Server mode only reads SSL client files from storage directories.
    SHARED_STORAGE = [
        {'name': 'postgres-certs', 'path': '/var/run/secrets/postgresql', 'restricted_access': True},
        {'name': 'root-ca', 'path': '/var/run/secrets/root-ca', 'restricted_access': True},
    ]

    OAUTH2_CONFIG = [
        {
            'OAUTH2_NAME': 'kanidm',
            'OAUTH2_DISPLAY_NAME': 'Login with Kanidm',
            'OAUTH2_CLIENT_ID': os.environ.get('OAUTH2_CLIENT_ID'),
            'OAUTH2_CLIENT_SECRET': os.environ.get('OAUTH2_CLIENT_SECRET'),
            'OAUTH2_SERVER_METADATA_URL': 'https://sso.siron.casa/oauth2/openid/pgadmin-app/.well-known/openid-configuration',
            'OAUTH2_SCOPE': 'openid email profile groups',
            'OAUTH2_CHALLENGE_METHOD': 'S256',
            'OAUTH2_RESPONSE_TYPE': 'code',
            'OAUTH2_USERNAME_CLAIM': 'preferred_username',
            'OAUTH2_AUTO_CREATE_USER': True,
            'OAUTH2_SSL_CERT_VERIFICATION': True,
        }
    ]
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "postgres",
          "Group": "home",
          "Host": "pooler-rw.database.svc.cluster.local",
          "Port": 5432,
          "Username": "pgadmin",
          "MaintenanceDB": "postgres",
          "Service": "home",
          "ConnectionParameters": {
            "sslmode": "verify-full",
            "sslcert": "postgres-certs:/tls.crt",
            "sslkey": "postgres-certs:/tls.key",
            "sslrootcert": "root-ca:/ca.crt"
          }
        }
      }
    }
  pg_service.conf: |
    [home]
    user=pgadmin
    host=pooler-rw.database.svc.cluster.local
    port=5432
    dbname=postgres
    sslmode=verify-full
