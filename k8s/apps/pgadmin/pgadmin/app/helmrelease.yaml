---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pgadmin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    defaultExternalSecretStoreRef:
      kind: ClusterSecretStore
      name: onepassword
    externalSecrets:
      credentials:
        forceRename: pgadmin
        refreshInterval: "0"
        target:
          name: pgadmin-secret
          deletionPolicy: Retain
          template:
            data:
              PGADMIN_DEFAULT_PASSWORD: "{{ .password }}"
        dataFrom:
          - sourceRef:
              generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                name: pgadmin-default-password
    controllers:
      pgadmin:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          pgadmin:
            image:
              repository: dpage/pgadmin4
              # renovate: datasource=docker depName=dpage/pgadmin4
              tag: "9.19"
            # The entrypoint only imports servers for the internal default user, but
            # SSL client files of a shared server are never passed to other users.
            # Import the server as owned by the OAuth user instead.
            command: ["/bin/bash", "-ec"]
            args:
              - |
                user=sironheart@sso.siron.casa
                export PGADMIN_SETUP_EMAIL="$PGADMIN_DEFAULT_EMAIL" PGADMIN_SETUP_PASSWORD="$PGADMIN_DEFAULT_PASSWORD"
                /venv/bin/python3 /pgadmin4/setup.py setup-db
                /venv/bin/python3 /pgadmin4/setup.py add-external-user "$user" --auth-source oauth2
                /venv/bin/python3 /pgadmin4/setup.py load-servers /pgadmin4/servers.json --user "$user" --auth-source oauth2
                exec /entrypoint.sh
            env:
              PGADMIN_DEFAULT_EMAIL: admin@siron.casa
              PGADMIN_LISTEN_PORT: &port 5050
              PGADMIN_DISABLE_POSTFIX: "true"
              PGADMIN_CUSTOM_CONFIG_DISTRO_FILE: /tmp/config_distro.py
              PGSERVICEFILE: /pgadmin4/pg_service.conf
              # Upstream warnings from bundled sshtunnel and pgAdmin's alembic migrations.
              PYTHONWARNINGS: ignore::SyntaxWarning,ignore::UserWarning:alembic.operations.batch
              OAUTH2_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: pgadmin-app-kanidm-oauth2-credentials
                    key: CLIENT_ID
              OAUTH2_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: pgadmin-app-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
            envFrom:
              - secretRef:
                  name: pgadmin-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /misc/ping
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      pgadmin:
        controller: pgadmin
        ports:
          http:
            port: *port
    route:
      pgadmin:
        hostnames: ["pgadmin.siron.casa"]
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: pgadmin
                port: *port
    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /var/lib/pgadmin
          - path: /tmp
      config:
        type: configMap
        name: pgadmin-config
        advancedMounts:
          pgadmin:
            pgadmin:
              - path: /pgadmin4/config_local.py
                subPath: config_local.py
              - path: /pgadmin4/servers.json
                subPath: servers.json
              - path: /pgadmin4/pg_service.conf
                subPath: pg_service.conf
