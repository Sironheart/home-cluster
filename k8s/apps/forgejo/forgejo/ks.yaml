---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: forgejo
  components:
    - ../../../../components/kopiur
    - ../../../../components/volsync
    - ../../../../components/database
    - ../../../../components/dragonfly
    - ../../../../components/anubis
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./k8s/apps/forgejo/forgejo/app
  postBuild:
    substitute:
      APP: forgejo
      VOLSYNC_CAPACITY: 20Gi
      KOPIUR_CAPACITY: 20Gi
      DRAGONFLY_REPLICAS: "1"
      ANUBIS_TARGET: http://forgejo-http:3000
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-runner
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: forgejo
  interval: 1h
  path: ./k8s/apps/forgejo/forgejo/runner
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
