---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo-anubis
spec:
  hostnames:
    - forgejo.siron.casa
  parentRefs:
    - name: external
      namespace: network
  rules:
    - backendRefs:
        - kind: Service
          name: forgejo-anubis
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 300s
