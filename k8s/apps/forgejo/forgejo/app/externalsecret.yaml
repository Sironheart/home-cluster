---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-signing-key
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: forgejo-signing-key
  data:
    - secretKey: ed25519
      remoteRef:
        key: forgejo
        property: private key
    - secretKey: ed25519.pub
      remoteRef:
        key: forgejo
        property: public key
