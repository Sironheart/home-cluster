---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ollama
spec:
  interval: 1h
  url: https://helm.otwld.com/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
spec:
  interval: 1h
  chart:
    spec:
      chart: ollama
      version: 1.64.0
      sourceRef:
        kind: HelmRepository
        name: ollama
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    resources:
      requests:
        cpu: 8
        memory: 6144Mi
      limits:
        memory: 6144Mi
    ollama:
      gpu:
        enabled: true
        type: amd
        number: 1
      models:
        clean: true
        pull:
          - gemma3:4b
          - llava:7b
    extraEnv:
      - name: OLLAMA_USE_MMAP
        value: "false"
      - name: OLLAMA_LOG_FORMAT
        value: json
    persistentVolume:
      enabled: true
      storageClass: ceph-block
    livenessProbe:
      enabled: true
    readinessProbe:
      enabled: true
