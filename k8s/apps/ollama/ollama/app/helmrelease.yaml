---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ollama
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    controllers:
      llamacpp:
        initContainers:
          model-init:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              # renovate: datasource=docker depName=ghcr.io/ggml-org/llama.cpp
              tag: server-vulkan-b5350
            command:
              - /bin/sh
              - -c
              - >-
                [ -f /data/bge-m3-Q8_0.gguf ] ||
                curl -fsSL --retry 5 -o /data/bge-m3-Q8_0.gguf
                https://huggingface.co/gpustack/bge-m3-GGUF/resolve/main/bge-m3-Q8_0.gguf
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          llamacpp:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              # renovate: datasource=docker depName=ghcr.io/ggml-org/llama.cpp
              tag: server-vulkan-b5350
            args:
              - --embeddings
              - --metrics
              - --pooling
              - cls
              - -m
              - /data/bge-m3-Q8_0.gguf
              - --host
              - 0.0.0.0
              - --port
              - "80"
              - --alias
              - bge-m3
              - -ngl
              - "99"
              - --ctx-size
              - "8192"
              - --batch-size
              - "8192"
              - --ubatch-size
              - "8192"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 80
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 80
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 80
                  periodSeconds: 10
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
                amd.com/gpu: 1
              limits:
                memory: 2Gi
                amd.com/gpu: 1

    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      ollama:
        controller: llamacpp
        ports:
          http: { port: 11434, targetPort: 80 }

    serviceMonitor:
      ollama:
        enabled: true
        serviceName: *app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s

    persistence:
      models:
        existingClaim: *app
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
