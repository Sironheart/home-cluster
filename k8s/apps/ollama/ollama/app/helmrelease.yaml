---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ollama
spec:
  interval: 1h
  url: https://helm.otwld.com/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
spec:
  interval: 1h
  chart:
    spec:
      chart: ollama
      version: 1.44.0
      sourceRef:
        kind: HelmRepository
        name: ollama
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    resources:
      requests:
        amd.com/gpu: 1
    ollama:
      gpu:
        enabled: true
        type: amd
        number: 1
      models:
        pull:
          - gemma3:4b
          - llava:7b
    updateStrategy:
      type: RollingUpdate
