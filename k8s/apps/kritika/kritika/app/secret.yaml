---
apiVersion: v1
kind: Secret
metadata:
  name: kritika-postgres-app
stringData:
  uri: postgresql://kritika_app@pooler-rw.database.svc.cluster.local:5432/kritika?sslmode=verify-full&sslcert=/var/run/secrets/postgresql-app/tls.crt&sslkey=/var/run/secrets/postgresql-app/tls.key&sslrootcert=/var/run/secrets/root-ca/ca.crt&connect_timeout=10
