---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kritika-credentials
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: kritika
        property: admin_password
    - secretKey: FORGEJO_PRIVATE_KEY
      remoteRef:
        key: kritika key
        property: private key
    - secretKey: FORGEJO_WEBHOOK_SECRET
      remoteRef:
        key: kritika
        property: forgejo_webhook_secret
