---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kritika
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: kritika
  components:
    - ../../../../components/database/manual
  dependsOn:
    - name: instance
      namespace: database
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kritika
      namespace: kritika
  interval: 1h
  path: ./k8s/apps/kritika/kritika/app
  postBuild:
    substitute:
      APP: kritika
      DATABASE_EXTENSIONS: |
        [
          { name: vector },
          { name: vchord }
        ]
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
