---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: penpot
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: penpot
    template:
      data:
        PENPOT_SECRET_KEY: "{{ .appSecretKey }}"
        connection_url: "postgresql://postgres-rw.database.svc.cluster.local:5432/${APP}?sslmode=verify-full&sslcert=/var/run/secrets/postgresql/tls.crt&sslkey=/var/run/secrets/postgresql/tls.key&sslrootcert=/var/run/secrets/root-ca/ca.crt"
  dataFrom:
    - extract:
        key: penpot
