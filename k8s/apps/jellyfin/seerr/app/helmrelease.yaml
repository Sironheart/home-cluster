---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    defaultExternalSecretStoreRef:
      kind: ClusterSecretStore
      name: onepassword
    externalSecrets:
      credentials:
        forceRename: seerr
        target:
          name: seerr-secret
          deletionPolicy: Retain
          template:
            data:
              API_KEY: "{{ .api_key }}"
        dataFrom:
          - extract:
              key: seerr
      database:
        forceRename: seerr-db
        refreshInterval: 5m
        target:
          name: seerr-db-secret
          deletionPolicy: Retain
          template:
            data:
              DB_TYPE: postgres
              DB_USE_SSL: "true"
              DB_SSL_REJECT_UNAUTHORIZED: "true"
              DB_HOST: "{{ .host }}"
              DB_PORT: "{{ .port }}"
              DB_USER: "{{ .user }}"
              DB_NAME: "{{ .db_name }}"
              DB_SSL_CA_FILE: "{{ .ssl_ca }}"
              DB_SSL_KEY_FILE: "{{ .ssl_key }}"
              DB_SSL_CERT_FILE: "{{ .ssl_cert }}"
        dataFrom:
          - extract:
              key: seerr-postgres
    controllers:
      seerr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          seerr:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
            env:
              LOG_LEVEL: "info"
              PORT: &port 80
            envFrom:
              - secretRef:
                  name: seerr-secret
              - secretRef:
                  name: seerr-db-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/settings/public
                    port: *port
                  initialDelaySeconds: 20
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 11m
                memory: 190Mi
              limits:
                memory: 394Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      seerr:
        controller: seerr
        ports:
          http:
            port: *port
    route:
      seerr:
        hostnames:
          - request.siron.casa
        parentRefs:
          - name: external
            namespace: network
        rules:
          - backendRefs:
              - identifier: seerr
                port: *port
    persistence:
      config:
        existingClaim: seerr
        globalMounts:
          - path: /app/config
      config-cache:
        existingClaim: seerr-cache
        globalMounts:
          - path: /app/config/cache
      tmpfs:
        type: emptyDir
        advancedMounts:
          seerr:
            seerr:
              - path: /app/config/logs
                subPath: logs
              - path: /tmp
                subPath: tmp
