---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bookboss
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    defaultExternalSecretStoreRef:
      kind: ClusterSecretStore
      name: onepassword
    externalSecrets:
      credentials:
        forceRename: bookboss
        refreshInterval: 5m
        target:
          name: bookboss-secret
          deletionPolicy: Retain
          template:
            data:
              BOOKBOSS__ENCRYPTION_SECRET: "{{ .encryption_secret }}"
              BOOKBOSS__METADATA__HARDCOVER_API_TOKEN: "{{ .hardcover_api_token }}"
              BOOKBOSS__METADATA__GOOGLEBOOKS_API_TOKEN: "{{ .googlebooks_api_token }}"
        dataFrom:
          - extract:
              key: bookboss
    controllers:
      bookboss:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          bookboss:
            image:
              repository: ghcr.io/szinn/bookboss
              # renovate: datasource=docker depName=ghcr.io/szinn/bookboss
              tag: v0.8.38
            env:
              BOOKBOSS__DATABASE__DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: bookboss-postgres
                    key: url
              BOOKBOSS__FRONTEND__BASE_URL: https://bookboss.siron.casa
              BOOKBOSS__FRONTEND__LISTEN_PORT: &port 8080
              BOOKBOSS__IMPORT__BOOKDROP_PATH: /books/bookdrop
              BOOKBOSS__LIBRARY__LIBRARY_PATH: /books
              BOOKBOSS__OIDC__BUTTON_LABEL: Sign in with Kanidm
              BOOKBOSS__OIDC__DISCOVERY_URL: https://sso.siron.casa/oauth2/openid/bookboss-app/.well-known/openid-configuration
              BOOKBOSS__OIDC__CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: bookboss-app-kanidm-oauth2-credentials
                    key: CLIENT_ID
              BOOKBOSS__OIDC__CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: bookboss-app-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
            envFrom:
              - secretRef:
                  name: bookboss-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket: { port: *port }
                  periodSeconds: 30
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      bookboss:
        controller: bookboss
        ports:
          http:
            port: *port
    route:
      bookboss:
        hostnames: ["bookboss.siron.casa"]
        parentRefs:
          - name: external
            namespace: network
        rules:
          - backendRefs:
              - identifier: bookboss
                port: *port
    persistence:
      books:
        type: nfs
        server: 192.168.1.2
        path: /volume2/books
        globalMounts:
          - path: /books
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
