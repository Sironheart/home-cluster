---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.onepassword.svc:8080
      vaults:
        "Home Cluster": 1
      auth:
        secretRef:
          connectTokenSecretRef:
            key: token
            name: onepassword-token
            namespace: onepassword
