---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflared-token
    template:
      data:
        TUNNEL_TOKEN: "{{ .token }}"
  dataFrom:
    - extract:
        key: cloudflared
