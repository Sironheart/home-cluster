---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-issuer
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflare-token
    template:
      data:
        CLOUDFLARE_DNS_TOKEN: "{{ .api_token }}"
  dataFrom:
    - extract:
        key: cloudflare-dns
