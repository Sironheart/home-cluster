---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: barman-plugin
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.8.0
  url: oci://ghcr.io/cloudnative-pg/charts/plugin-barman-cloud
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: barman-plugin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: barman-plugin
  values:
    resources:
      limits:
        memory: 217Mi
      requests:
        memory: 70Mi
        cpu: 10m
