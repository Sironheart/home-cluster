---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pooler-rw
spec:
  cluster:
    name: postgres

  instances: 2
  type: rw
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  cnpg.io/poolerName: pooler-rw
              topologyKey: kubernetes.io/hostname
      containers:
        - name: pgbouncer
          # CNPG already provides the backend client certificate and CA here.
          readinessProbe:
            exec:
              command:
                - psql
                - -XqAt
                - -v
                - ON_ERROR_STOP=1
                - -d
                - >-
                  host=pooler-rw.database.svc.cluster.local hostaddr=127.0.0.1
                  user=pooler-rw dbname=postgres sslmode=verify-full
                  sslrootcert=/controller/configs/server-tls/ca.crt
                  sslcert=/controller/configs/server-tls/tls.crt
                  sslkey=/controller/configs/server-tls/tls.key connect_timeout=3
                - -c
                - SELECT 1
            timeoutSeconds: 5
  pgbouncer:
    poolMode: session

    authQuery: "SELECT $1, NULL"
    serverCASecret:
      name: root-ca
    serverTLSSecret:
      name: pooler-client-cert
    clientCASecret:
      name: pooler-client-cert
    clientTLSSecret:
      name: pooler-server-cert

    parameters:
      # server_tls_protocols: tlsv1.3
      auth_type: cert
      server_tls_sslmode: verify-full
      client_tls_sslmode: verify-full
      max_client_conn: "1000"
      default_pool_size: "10"
      ignore_startup_parameters: statement_timeout
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: &name pooler-rw
spec:
  selector:
    matchLabels:
      cnpg.io/poolerName: *name
  podMetricsEndpoints:
    - port: metrics
