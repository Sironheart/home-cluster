---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: dragonfly
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v1.7.1
  url: oci://ghcr.io/dragonflydb/dragonfly-operator/helm/dragonfly-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: dragonfly
  values:
    rbacProxy:
      resources:
        limits:
          cpu: ~
    crds:
      install: true
      keep: true
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
      grafanaOperator:
        enabled: true
        matchLabels:
          instance: grafana
    manager:
      resources:
        requests:
          cpu: 10m
          memory: 284Mi
        limits:
          cpu: ~
          memory: 284Mi
