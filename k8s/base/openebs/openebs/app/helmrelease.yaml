---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  chartRef:
    kind: OCIRepository
    name: openebs
  interval: 30m
  values:
    alloy:
      enabled: false
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false
    localpv-provisioner:
      analytics:
        enabled: false
      helperPod:
        image:
          registry: quay.io/
      localpv:
        basePath: /var/mnt/local-hostpath
        image:
          registry: quay.io/
    loki:
      enabled: false
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: false
    preUpgradeHook:
      enabled: false
