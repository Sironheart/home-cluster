---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: system-controllers
components:
  - ../../../k8s-components/common
patches:
  - patch: |
      - op: add
        path: /metadata/labels/k8tz.io~1controller-namespace
        value: "true"
    target:
      kind: Namespace
resources:
  - ./k8tz/ks.yaml
replacements:
  - path: ../../../k8s-components/replacements/ks.yaml
