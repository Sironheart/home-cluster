---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: auth-credential-provider
spec:
  interval: 1h
  url: https://github.com/Sironheart/auth-credential-users
  ref:
    branch: main
  secretRef:
    name: github-app-auth
  provider: github
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: user-auth-repo
spec:
  interval: 1h
  prune: true
  sourceRef:
    kind: GitRepository
    name: auth-credential-provider
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-secret-key
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        githubAppID: "{{ .appId }}"
        githubAppInstallationID: "{{ .installId }}"
        githubAppPrivateKey: "{{ .secretKey }}"
    name: github-app-auth
  dataFrom:
    - extract:
        key: siron-bot-github-app
