---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: auth-credential-provider
spec:
  interval: 1h
  url: ssh://git@forgejo.siron.casa:22222/sironheart/auth-credential-users.git
  ref:
    branch: main
  secretRef:
    name: forgejo-auth-credential-provider
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: user-auth-repo
spec:
  interval: 1h
  prune: true
  sourceRef:
    kind: GitRepository
    name: auth-credential-provider
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-auth-credential-provider
spec:
  refreshInterval: 30m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: forgejo-auth-credential-provider
    template:
      type: Opaque
      engineVersion: v2
      data:
        identity: "{{ .privateKey }}"
        known_hosts: "[forgejo.siron.casa]:22222 ssh-rsa "
  data:
    - secretKey: privateKey
      remoteRef:
        key: ssh-deploy-token
        property: private key
