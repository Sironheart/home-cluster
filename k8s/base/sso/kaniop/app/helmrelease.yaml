---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kaniop
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://ghcr.io/pando85/helm-charts/kaniop
  ref:
    tag: 0.12.1
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kaniop
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    webhook:
      enabled: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
