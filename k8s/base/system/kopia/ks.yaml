---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopia
spec:
  components: []
  dependsOn:
    - name: volsync
  interval: 1h
  path: ./k8s/base/system/kopia/app
  postBuild:
    substitute:
      APP: kopia
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
