---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: amd-rocm
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      instance: grafana
  title: AMD Rocm
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: amd-overview
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      instance: grafana
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
  url: "https://raw.githubusercontent.com/ROCm/device-metrics-exporter/refs/heads/main/grafana/dashboard_overview.json"
  folderRef: amd-rocm
