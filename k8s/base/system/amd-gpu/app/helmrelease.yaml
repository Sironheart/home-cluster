---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: amd-gpu
spec:
  interval: 1h
  url: https://rocm.github.io/k8s-device-plugin/
  timeout: 3m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-gpu
  namespace: system
spec:
  interval: 1h
  chart:
    spec:
      chart: amd-gpu
      version: 0.20.0
      sourceRef:
        kind: HelmRepository
        name: amd-gpu
  maxHistory: 3
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    labeller:
      enabled: true
    nfd:
      enabled: false
    securityContext:
      allowPrivilegeEscalation: true
