---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: rocm
spec:
  interval: 1h
  url: https://rocm.github.io/gpu-operator
  timeout: 5m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rocm
  namespace: system
spec:
  interval: 1h
  chart:
    spec:
      chart: gpu-operator-charts
      version: v1.4.1
      sourceRef:
        kind: HelmRepository
        name: rocm
  values:
    crds:
      defaultCR:
        # Reconcile the DeviceConfig so exporter resource changes take effect.
        upgrade: true
    deviceConfig:
      spec:
        metricsExporter:
          resource:
            limits:
              cpu: ~
              memory: 4G
            requests:
              cpu: 500m
              memory: 512M
    controllerManager:
      manager:
        resources:
          limits:
            cpu: ~
    kmm:
      controller:
        manager:
          resources:
            limits:
              cpu: ~
      webhookServer:
        webhookServer:
          resources:
            limits:
              cpu: ~
    upgradePolicy:
      upgradeStrategy: OnDelete
    serviceMonitor:
      enabled: true
      attachMetadata:
        node: true
