---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: rocm
spec:
  interval: 1h
  url: https://rocm.github.io/gpu-operator
  timeout: 5m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rocm
  namespace: system
spec:
  interval: 1h
  # shortcut: Talos manages AMD drivers; bypass stale module-state hooks until upstream handles driver.enable=false.
  upgrade:
    disableHooks: true
  rollback:
    disableHooks: true
  chart:
    spec:
      chart: gpu-operator-charts
      version: v1.4.1
      sourceRef:
        kind: HelmRepository
        name: rocm
  values:
    crds:
      defaultCR:
        # Reconcile the DeviceConfig so exporter resource changes take effect.
        upgrade: true
    deviceConfig:
      spec:
        driver:
          enable: false
        devicePlugin:
          upgradePolicy:
            upgradeStrategy: OnDelete
        metricsExporter:
          prometheus:
            serviceMonitor:
              enable: true
              attachMetadata:
                node: true
          resource:
            limits:
              memory: 4G
            requests:
              cpu: 500m
              memory: 512M
          upgradePolicy:
            upgradeStrategy: OnDelete
    controllerManager:
      manager:
        resources:
          limits:
            cpu: ~
    kmm:
      controller:
        manager:
          resources:
            limits:
              cpu: ~
      webhookServer:
        webhookServer:
          resources:
            limits:
              cpu: ~
