---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
spec:
  chartRef:
    kind: OCIRepository
    name: descheduler
  interval: 30m
  values:
    kind: Deployment
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        cpu: ~
        memory: 100Mi
    deschedulerPolicyAPIVersion: descheduler/v1alpha2
    deschedulerPolicy:
      metricsProviders:
        - source: KubernetesMetrics
      profiles:
        - name: Default
          pluginConfig:
            - name: DefaultEvictor
              args:
                evictFailedBarePods: true
                evictLocalStoragePods: true
                evictSystemCriticalPods: true
            - name: RemoveFailedPods
              args:
                reasons:
                  - ContainerStatusUnknown
                  - NodeAffinity
                  - NodeShutdown
                  - Terminated
                  - UnexpectedAdmissionError
                includingInitContainers: true
                excludeOwnerKinds:
                  - Job
                minPodLifetimeSeconds: 1800
            - name: RemovePodsViolatingInterPodAntiAffinity
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution
            - name: RemovePodsViolatingNodeTaints
            - name: RemovePodsViolatingTopologySpreadConstraint
          plugins:
            balance:
              enabled:
                - RemovePodsViolatingTopologySpreadConstraint
            deschedule:
              enabled:
                - RemoveFailedPods
                - RemovePodsViolatingInterPodAntiAffinity
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingNodeTaints
        - name: UsageBalance
          pluginConfig:
            - name: DefaultEvictor
              args:
                nodeFit: true
                evictLocalStoragePods: true
                evictFailedBarePods: true
            - name: LowNodeUtilization
              args:
                useDeviationThresholds: true
                thresholds:
                  cpu: 10
                  memory: 10
                targetThresholds:
                  cpu: 10
                  memory: 10
                metricsUtilization:
                  source: KubernetesMetrics
                evictionLimits:
                  node: 2
                evictableNamespaces:
                  exclude:
                    - kube-system
          plugins:
            balance:
              enabled:
                - LowNodeUtilization
    service:
      enabled: true
    serviceMonitor:
      enabled: true
    leaderElection:
      enabled: true
