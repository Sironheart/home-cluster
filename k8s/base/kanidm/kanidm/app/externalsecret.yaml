---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kanidm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kanidm-token
    template:
      data:
        KANIDM_TOKEN: "{{ .token }}"
  dataFrom:
    - extract:
        key: kanidm
