---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: miroir-replicated
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: miroir.home-operations.com
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  miroir.home-operations.com/replicas: "3"
  miroir.home-operations.com/quorum: freeze
  csi.storage.k8s.io/fstype: ext4
---
# Kopiur's staged backup clones are deleted after upload; replicating them would resync on every run.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: miroir-staging
provisioner: miroir.home-operations.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  miroir.home-operations.com/replicas: "1"
  csi.storage.k8s.io/fstype: ext4
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: csi-miroir
driver: miroir.home-operations.com
deletionPolicy: Delete
