---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: garage-operator
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./k8s/base/garage/garage-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
