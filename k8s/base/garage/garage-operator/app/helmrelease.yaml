---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: garage-operator
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: -1
  values:
    prometheusRules:
      enabled: true
      labels:
        component: garage-operator
    grafanaDashboard:
      enabled: true
