---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: garage
spec:
  interval: 5m
  url: https://git.deuxfleurs.fr/Deuxfleurs/garage.git
  ref:
    tag: v2.2.0
  ignore: |-
    # exclude all
    /*
    # include charts directory
    !/script/helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
spec:
  interval: 1h
  chart:
    spec:
      chart: script/helm/garage
      sourceRef:
        kind: GitRepository
        name: garage
        namespace: garage
  values:
    podSecurityContext:
      fsGroupChangePolicy: "OnRootMismatch"

    garage:
      replicationFactor: "1"

      s3:
        api:
          rootDomain: ".s3.siron.casa"
        web:
          rootDomain: ".web.siron.casa"

    persistence:
      meta:
        storageClass: ceph-block
        size: 1Gi
      data:
        storageClass: ceph-block
        size: 10Gi

    deployment:
      replicaCount: 1

    monitoring:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
