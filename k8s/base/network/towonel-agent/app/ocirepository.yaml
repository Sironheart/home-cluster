---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: towonel-agent
spec:
  interval: 15m
  url: oci://git.ow-ops.eu/towonel/charts/towonel-agent
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.7.1
  verify:
    provider: cosign
    secretRef:
      name: towonel-cosign-pub
