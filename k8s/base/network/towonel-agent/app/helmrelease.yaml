---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-agent
spec:
  chartRef:
    kind: OCIRepository
    name: towonel-agent
  interval: 1h
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
    agent:
      services:
        - hostname: "*.siron.casa"
          origin: external.network.svc.cluster.local:443
      tcpServices:
        - name: forgejo-ssh
          origin: external.network.svc.cluster.local:22222
          listen_port: 22222
      inviteTokenSecret:
        name: towonel-agent-secret
    serviceMonitor:
      main:
        enabled: true
        endpoints:
          - port: metrics
            interval: 1m
            scrapeTimeout: 10s
            path: /metrics
    monitoring:
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            instance: grafana
