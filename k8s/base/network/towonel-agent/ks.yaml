---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: towonel-agent
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  interval: 1h
  path: ./k8s/base/network/towonel-agent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
