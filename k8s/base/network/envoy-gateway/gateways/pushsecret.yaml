---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: siron-casa-tls
spec:
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: siron-casa-tls
  template:
    engineVersion: v2
    data:
      tls.crt: '{{ index . "tls.crt" | b64enc }}'
      tls.key: '{{ index . "tls.key" | b64enc }}'
  data:
    - match:
        secretKey: &key tls.crt
        remoteRef:
          remoteKey: siron-casa-tls
          property: *key
    - match:
        secretKey: &key tls.key
        remoteRef:
          remoteKey: siron-casa-tls
          property: *key
