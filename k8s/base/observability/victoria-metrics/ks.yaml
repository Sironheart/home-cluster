spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: victoria-metrics-operator
      namespace: &namespace observability
    - name: grafana-operator
      namespace: *namespace
  interval: 1h
  path: ./k8s/base/observability/victoria-metrics/metrics
  prune: true
