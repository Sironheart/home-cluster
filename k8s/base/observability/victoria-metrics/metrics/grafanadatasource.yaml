---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoriametrics
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      instance: grafana
  datasource:
    access: proxy
    type: prometheus # Honestly, I don't get why this value is necessary but it works afterwards :c
    name: VictoriaMetrics
    url: http://vmsingle-vm:8428
    isDefault: true
  resyncPeriod: "10m0s"
  plugins:
    - name: victoriametrics-metrics-datasource
      version: latest
