---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app victoria-metrics
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  dependsOn:
    - name: victoria-metrics-operator
  values:
    nameOverride: *app

    global:
      clusterLabel: home

    victoria-metrics-operator:
      enabled: false

    vmagent:
      enabled: enabled

    vmalert:
      enabled: true
      route:
        enabled: true
        parentRefs:
          - name: internal
            namespace: network
        hostnames:
          - vmalert.siron.casa

    vmsingle:
      spec:
        image:
          repository: victoriametrics/victoria-metrics
          tag: v1.147.0
          pullPolicy: IfNotPresent
        retentionPeriod: 30d
        resources:
          limits:
            memory: 2500Mi
          requests:
            cpu: 150m
            memory: 500Mi
      route:
        enabled: true
        parentRefs:
          - name: internal
            namespace: network
        hostnames:
          - vmsingle.siron.casa

    grafana:
      enabled: false
      forceDeployDatasource: true

    alertmanager:
      enabled: true
      useManagedConfig: false

      spec:
        externalURL: https://vmalertmanager.siron.casa
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
        volumes:
          - name: discord-webhook
            secret:
              secretName: alertmanager-discord-webhook
        volumeMounts:
          - name: discord-webhook
            mountPath: /etc/alertmanager/secrets/discord
            readOnly: true

      route:
        enabled: true
        hostnames:
          - vmalertmanager.siron.casa
        parentRefs:
          - name: internal
            namespace: network

      config:
        route:
          receiver: discord
          group_by: ['alertname', 'severity', 'instance']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - matchers:
                - alertname="KubeMemoryOvercommit"
              receiver: blackhole
            - matchers:
                - alertname="CephNodeDiskspaceWarning"
              receiver: blackhole
            - matchers:
                - alertname="etcdDatabaseHighFragmentationRatio"
              receiver: blackhole
            - matchers:
                - alertname="Watchdog"
              receiver: blackhole
            - matchers:
                - alertname="InfoInhibitor"
              receiver: blackhole
            - matchers:
                - alertname="ScrapePoolHasNoTargets"
                - scrape_job=~"serviceScrape/rook-ceph/csi-metrics.*"
              receiver: blackhole
            - matchers:
                - alertname="CPUThrottlingHigh"
                - pod=~"forgejo-runner-.*"
              receiver: blackhole
        receivers:
          - name: blackhole
          - name: discord
            discord_configs:
              - webhook_url_file: /etc/alertmanager/secrets/discord/webhook-url
                send_resolved: true
                title: |
                  [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ else }}:{{ .Alerts.Resolved | len }}{{ end }}] {{ .CommonLabels.alertname }}
                message: |
                  {{ range .Alerts.Firing }}
                  **Firing:** {{ .Annotations.summary }}
                  **Description:** {{ .Annotations.description }}
                  **Severity:** {{ .Labels.severity }}
                  {{ end }}
                  {{ range .Alerts.Resolved }}
                  **Resolved:** {{ .Annotations.summary }}
                  **Description:** {{ .Annotations.description }}
                  **Severity:** {{ .Labels.severity }}
                  {{ end }}

    defaultDatasources:
      grafanaOperator:
        enabled: true
        spec:
          allowCrossNamespaceImport: true
          instanceSelector:
            matchLabels:
              dashboards: null
              instance: grafana

    defaultDashboards:
      enabled: true
      grafanaOperator:
        enabled: true
        spec:
          allowCrossNamespaceImport: true
          instanceSelector:
            matchLabels:
              dashboards: null
              instance: grafana
      dashboards:
        victoriametrics-operator:
          enabled: false

    prometheus-node-exporter:
      enabled: true
      fullnameOverride: node-exporter

    kube-state-metrics:
      enabled: true
      fullnameOverride: kube-state-metrics

    kubelet:
      enabled: true
      vmScrapes:
        kubelet:
          enabled: true
      vmScrape:
        spec:
          port: "10250"
          relabelConfigs:
            # This is the same as the chart default, but it explicitly excludes NFD node labels,
            # and talos extension labels, and some others. These don't really provide any value,
            # and they cause cardinality to explode.
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - action: labeldrop
              regex: (feature_node|extensions_talos_dev|beta_kubernetes|plan_upgrade_cattle_io|openebs_io|katacontainers_io|topology_rook_io_).*
            - action: labeldrop
              regex: .*home_arpa.*
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
            - targetLabel: job
              replacement: kubelet

    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              max_scrape_size: "33554432"
              metricRelabelConfigs:
                # Sizes: rarely useful, high cardinality
                - source_labels: [__name__]
                  regex: apiserver_(request_body_size_bytes|response_sizes|watch_events_sizes)_(bucket|sum|count)
                  action: drop

                # Watch internals: useful only for deep watch debugging
                - source_labels: [__name__]
                  regex: apiserver_(watch_list_duration_seconds|watch_cache_read_wait_seconds)_(bucket|sum|count)
                  action: drop

                # APF buckets: keep gauges/counters, drop histograms
                - source_labels: [__name__]
                  regex: apiserver_flowcontrol_.*_bucket
                  action: drop

                # Admission histograms: keep totals, drop buckets
                - source_labels: [__name__]
                  regex: apiserver_admission_(controller|webhook|step|match_condition_evaluation)_duration_seconds_bucket
                  action: drop

                # Apiserver-internal workqueues: duplicated from controllers
                - source_labels: [__name__]
                  regex: workqueue_(queue_duration_seconds|work_duration_seconds)_(bucket|sum|count)
                  action: drop

                # Rest-client histograms from the apiserver: already dropped for kubelet
                - source_labels: [__name__]
                  regex: rest_client_(request_duration_seconds|request_size_bytes|response_size_bytes)_(bucket|sum|count)
                  action: drop

                # Static / per-CRD low-value metrics
                - source_labels: [__name__]
                  regex: (kubernetes_feature_enabled|apiextensions_openapi_v3_regeneration_count)
                  action: drop

    kubeEtcd:
      service:
        selector:
          component: kube-apiserver
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - scheme: http

    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true
