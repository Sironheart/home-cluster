---
apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: vl
spec:
  image:
    repository: victoriametrics/victoria-logs
    tag: v1.47.0
    pullPolicy: IfNotPresent
  extraArgs:
    enableTCP6: "true"
  retentionPeriod: 365d
  retentionMaxDiskSpaceUsageBytes: 20GB
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        cpu: 20m
        memory: 419Mi
        storage: 50Gi
      limits:
        cpu: ~
        memory: 419Mi
    storageClassName: ceph-block
