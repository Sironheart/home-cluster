---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: logs-collector
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  dependsOn:
    - name: victoria-metrics-operator
  values:
    fullnameOverride: victoria-logs
    dashboards:
      enabled: true
    server:
      image:
        repository: victoriametrics/victoria-logs
        tag: v1.50.0
        pullPolicy: IfNotPresent
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 50Gi
      retentionPeriod: 90d
      route:
        enabled: true
        hostnames:
          - vlogs.siron.casa
        parentRefs:
          - name: internal
            namespace: network
      serviceMonitor:
        enabled: true
