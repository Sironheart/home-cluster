---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  dependsOn:
    - name: victoria-metrics-operator
  values:
    fullnameOverride: victoria-logs
    dashboards:
      enabled: true
    server:
      image:
        repository: victoriametrics/victoria-logs
        tag: v1.52.0
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          memory: 768Mi
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 50Gi
      retentionPeriod: 90d
      route:
        enabled: true
        hostnames:
          - vlsingle.siron.casa
        parentRefs:
          - name: internal
            namespace: network
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          spec:
            allowCrossNamespaceImport: true
            instanceSelector:
              matchLabels:
                instance: grafana
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
spec:
  interval: 1h
  chartRef:
    name: victoria-logs-collector
    kind: OCIRepository
  dependsOn:
    - name: victoria-metrics-operator
  values:
    image:
      repository: victoriametrics/vlagent
      tag: v1.51.0
    remoteWrite:
      - url: "http://victoria-logs-server.observability.svc.cluster.local:9428/insert/native"
    podMonitor:
      enabled: true
