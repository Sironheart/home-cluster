---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app victoria-traces
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  dependsOn:
    - name: victoria-metrics-operator
  values:
    nameOverride: victoria-traces

    server:
      image:
        repository: victoriametrics/victoria-traces
        tag: v0.8.1
      retentionPeriod: 90d
      persistentVolume:
        size: 20Gi

      route:
        enabled: true
        parentRefs:
          - name: internal
            namespace: network
        hostnames:
          - vtsingle.siron.casa

      serviceMonitor:
        enabled: true
