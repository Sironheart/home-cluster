---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-traces
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      instance: grafana
  datasource:
    access: proxy
    name: VictoriaTraces
    url: http://victoria-traces-server.observability.svc.cluster.local:10428/select/jaeger
    type: jaeger
