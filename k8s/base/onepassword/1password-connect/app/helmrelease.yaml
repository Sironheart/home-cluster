---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: 1password-connect
spec:
  interval: 10m
  url: https://1password.github.io/connect-helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: 1password-connect
spec:
  interval: 1h
  chart:
    spec:
      chart: connect
      version: 2.3.0
      sourceRef:
        kind: HelmRepository
        name: 1password-connect
      interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: 1password-connect-values
