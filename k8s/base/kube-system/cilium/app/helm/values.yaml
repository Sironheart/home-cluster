---
rollOutCiliumPods: true
policyAuditMode: true
# enableIPv4BIGTCP: true

l2announcements:
  enabled: true

localRedirectPolicies:
  enabled: true

endpointRoutes:
  enabled: true

nodeIPAM:
  enabled: true

operator:
  replicas: 1
  rollOutPods: true
  dashboards:
    enabled: true
  metrics:
    enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

bandwidthManager:
  enabled: true
  bbr: true

cni:
  exclusive: false

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true

envoy:
  rollOutPods: true
  prometheus:
    serviceMonitor:
      enabled: true

# -- from talos docs --
ipam:
  mode: kubernetes

kubeProxyReplacement: true
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
# -- end of talos settings --

# -- required for tailscale --
socketLB:
  hostNamespaceOnly: true
# -- end of tailscale settings --
