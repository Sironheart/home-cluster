---
localRedirectPolicy: true
rollOutCiliumPods: true
upgradeCompatibility: "1.18"
routingMode: native

autoDirectNodeRoutes: true
bpfClockProbe: true

bandwidthManager:
  enabled: true
  bbr: true

bpf:
  datapathMode: netkit
  masquerade: true
  preallocateMaps: true

cni:
  exclusive: false

envoy:
  rollOutPods: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE

  prometheus:
    serviceMonitor:
      enabled: true

gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true

hubble:
  enabled: true
  tls:
    auto:
      method: certmanager
      certManagerIssuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: cluster-ca
  ui:
    enabled: true
  relay:
    enabled: true

l2announcements:
  enabled: true

operator:
  replicas: 1
  rollOutPods: true
  dashboards:
    enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true

# -- from talos docs --
ipam:
  mode: kubernetes

kubeProxyReplacement: true
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256

policyAuditMode: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - PERFMON
      - BPF
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
# -- end of talos settings --

# -- required for tailscale --
socketLB:
  hostNamespaceOnly: true
# -- end of tailscale settings --
