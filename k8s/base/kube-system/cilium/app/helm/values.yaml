---
rollOutCiliumPods: true
policyAuditMode: true
logOptions:
  format: json

ipv6:
  enabled: true

routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.244.0.0/16
ipv6NativeRoutingCIDR: fd00:10:244::/48

bpf:
  masquerade: true

l2announcements:
  enabled: true

endpointRoutes:
  enabled: true

operator:
  rollOutPods: true
  dashboards:
    enabled: true
  prometheus:
    serviceMonitor:
      enabled: true

cni:
  resources:
    limits:
      cpu: ~

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true

envoy:
  prometheus:
    serviceMonitor:
      enabled: true

dashboards:
  enabled: true

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    # audit-mode verdicts only surface here (action="audit"), not in agent logs
    enabled:
      - policy:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
    serviceMonitor:
      enabled: true
  tls:
    auto:
      method: certmanager
      certManagerIssuerRef:
        group: cert-manager.io
        kind: Issuer
        name: hubble-ca

# -- from talos docs --
ipam:
  mode: kubernetes

kubeProxyReplacement: true
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
# -- end of talos settings --

# -- required for tailscale --
socketLB:
  hostNamespaceOnly: true
# -- end of tailscale settings --
