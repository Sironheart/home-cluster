---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall-ingress
spec:
  nodeSelector:
    matchLabels: {}
  ingress:
    - toPorts:
        - ports:
            - port: "443" # HTTPS
              protocol: TCP
            - port: "443" # HTTP3
              protocol: UDP
            - port: "80" # HTTP
              protocol: TCP
            - port: "53" # DNS
              protocol: TCP
            - port: "53" # DNS
              protocol: UDP
