---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo-sironheart
spec:
  metadata:
    annotations:
      reloader.stakater.com/auto: "true"
  discoveryFilters:
    - sironheart/*
  # renovate: datasource=docker depName=renovate/renovate
  image: renovate/renovate:43.261.4
  parallelism: 2
  schedule: 0 */4 * * *
  secretRef: forgejo-renovate
  extraEnv:
    - name: RENOVATE_ONBOARDING_CONFIG
      value: |
        {
          "$schema": "https://docs.renovatebot.com/renovate-schema.json",
          "extends": [
            'config:best-practices',
            'local>sironheart/renovate-preset',
          ]
        }
    - name: RENOVATE_ONBOARDING_CONFIG_FILE_NAME
      value: renovate.json5
    # - name: RENOVATE_REBASE_WHEN
    #   value: behind-base-branch
    - name: RENOVATE_AUTOMERGE_STRATEGY
      value: fast-forward
  provider:
    name: forgejo
    endpoint: https://forgejo.siron.casa/api/v1
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-webhook
        key: webhook
