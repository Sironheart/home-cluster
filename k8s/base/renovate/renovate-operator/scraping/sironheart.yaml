---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: sironheart
spec:
  metadata:
    annotations:
      reloader.stakater.com/auto: "true"
  discoveryFilter: "sironheart/*"
  # renovate: datasource=docker depName=renovate/renovate
  image: renovate/renovate:43.29.2
  parallelism: 5
  schedule: 0 * * * *
  secretRef: sironheart-renovate
  extraEnv:
    - name: RENOVATE_PLATFORM
      value: github
    - name: RENOVATE_ENDPOINT
      value: https://api.github.com/
    - name: RENOVATE_ALLOW_PLUGINS
      value: "true"
    - name: RENOVATE_ONBOARDING_CONFIG_FILE_NAME
      value: "renovate.json5"
  resources:
    requests:
      memory: 2G
      cpu: 2
    limits:
      memory: 2G
