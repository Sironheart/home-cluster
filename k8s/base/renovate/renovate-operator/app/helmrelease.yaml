---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: renovate-operator
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://ghcr.io/mogenius/helm-charts/renovate-operator
  ref:
    tag: 5.1.0
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token.actions.githubusercontent.com$"
        subject: "^https://github.com/mogenius/renovate-operator.*$"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: *name
  interval: 30m
  values:
    route:
      enabled: true
      hostnames: ["renovate.siron.casa"]
      parentRefs:
        - name: internal
          namespace: network

    config:
      globalParallelismLimit: 3

    valkey:
      existingSecret: renovate-redis-cache

    webhook:
      enabled: true
      route:
        enabled: true
        hostnames: ["renovate-webhook.siron.casa"]
        parentRefs:
          - name: external
            namespace: network
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
        grafanaDashboard:
          allowCrossNamespaceImport: true
          instanceSelector:
            matchLabels:
              grafana.internal/instance: ~
              instance: grafana
