---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: renovate-operator
spec:
  url: https://helm.mogenius.com/public
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  chart:
    spec:
      chart: renovate-operator
      version: 4.0.0
      sourceRef:
        kind: HelmRepository
        name: renovate-operator
  interval: 30m
  values:
    route:
      enabled: true
      hostnames: ["renovate.siron.casa"]
      parentRefs:
        - name: internal
          namespace: network

    webhook:
      enabled: true
      route:
        enabled: true
        hostnames: ["renovate-webhook.siron.casa"]
        parentRefs:
          - name: external
            namespace: network

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
        grafanaDashboard:
          allowCrossNamespaceImport: true
          instanceSelector:
            matchLabels:
              grafana.internal/instance: ~
              instance: grafana
