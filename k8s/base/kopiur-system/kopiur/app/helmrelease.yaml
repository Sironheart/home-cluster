---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  values:
    extraVolumes:
      - name: repo
        nfs:
          server: 192.168.1.2
          path: /volume2/backups/kopiur
    extraVolumeMounts:
      - name: repo
        mountPath: /repo
    features:
      credentialProjection:
        enabled: true
      kopiaUi:
        enabled: true
    installScope: cluster
    logging:
      format: json
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            instance: grafana
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    webhook:
      serviceMonitor:
        enabled: true
