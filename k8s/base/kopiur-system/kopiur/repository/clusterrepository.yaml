---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          server: 192.168.1.2
          path: /volume2/backups/kopiur
  catalog:
    periodicRefresh: true
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopia-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  create:
    enabled: true
  allowedNamespaces:
    all: true
  moverDefaults:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    ttlSecondsAfterFinished: 86400
  maintenance:
    enabled: true
  server:
    auth:
      insecure:
        acknowledgeInsecure: true
    namespace: kopiur-system
