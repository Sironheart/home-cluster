---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: kopiur
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kopiur
      namespace: kopiur-system
  interval: 1h
  path: "./k8s/base/kopiur-system/kopiur/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kopiur-system
  timeout: 5m
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-repository
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: kopiur-repository
  dependsOn:
    - name: kopiur
  interval: 1h
  path: "./k8s/base/kopiur-system/kopiur/repository"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kopiur-system
  timeout: 5m
  wait: false
