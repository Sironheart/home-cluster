---
clusterName: home
# renovate: depName=ghcr.io/siderolabs/installer datasource=docker
talosVersion: 1.10.5
# renovate: depName=ghcr.io/siderolabs/kubelet datasource=docker
kubernetesVersion: v1.33.3

endpoint: https://192.168.0.11:6443
allowSchedulingOnMasters: true
cniConfig:
  name: none

additionalMachineCertSans: &san
  - 127.0.0.1 #KubePrism
  - 192.168.0.11 #Talos01
  - 192.168.0.12 #Talos02
  - 192.168.0.13 #Talos03
  - 192.168.0.10 #VIP interface
  - talos.home #DNS route to VIP interface
additionalApiServerCertSans: *san

nodes:
  - hostname: talos01
    ipAddress: 192.168.0.11
    controlPlane: true
    disableSearchDomain: true

    installDisk: "/dev/nvme0n1"

    machineSpec:
      mode: metal
      arch: amd64
      secureboot: false
      useUKI: false

controlPlane:
  schematic:
    customization:
      extraKernelArgs:
        - net.ifnames=1 # Enable predictable NIC naming
        - init_on_alloc=0 # Less security, more speed
        - init_on_free=0 # Less security, more speed
        - iommu=pt # PCI Passthrough
        - talos.auditd.disabled=1
      systemExtensions:
        officialExtensions:
        - siderolabs/iscsi-tools
        - siderolabs/util-linux-tools

patches:
  # Disable search domain everywhere
  - |-
    machine:
      network:
        disableSearchDomain: true

  # Enable host dns
  - |-
    machine:
      features:
        hostDNS:
          enabled: true
          resolveMemberNames: true
          forwardKubeDNSToHost: false

  # Kubelet mount and machine labels for longhorn
  - |-
    machine:
      nodeLabels:
        node.longhorn.io/create-default-disk: config
      nodeAnnotations:
        node.longhorn.io/default-disks-config: '[{"path":"/var/mnt/longhorn","allowScheduling":true}]'
      kubelet:
        extraMounts:
          - destination: /var/lib/longhorn
            type: bind
            source: /var/lib/longhorn
            options: [bind, rshared, rw]

  # Wipe disk on install
  - |-
    machine:
      install:
        wipe: true

  # Replace kubeproxy with cilium
  - |-
    cluster:
      proxy:
        disabled: true

  # Kubelet configuration
  - |-
    machine:
      kubelet:
        disableManifestsDirectory: true
        extraConfig:
          maxPods: 250

  # Configure cluster
  - |-
    cluster:
      allowSchedulingOnControlPlanes: true
      controllerManager:
        extraArgs:
          bind-address: 0.0.0.0
      coreDNS:
          disabled: true
      proxy:
        disabled: true
      scheduler:
        config:
          apiVersion: kubescheduler.config.k8s.io/v1
          kind: KubeSchedulerConfiguration
          profiles:
            - schedulerName: default-scheduler
              pluginConfig:
                - name: PodTopologySpread
                  args:
                    defaultingType: List
                    defaultConstraints:
                      - maxSkew: 1
                        topologyKey: kubernetes.io/hostname
                        whenUnsatisfiable: ScheduleAnyway

  # Etcd metrics
  - |-
    cluster:
      etcd:
        extraArgs:
          listen-metrics-urls: http://0.0.0.0:2381

  # Enable K8s Talos API Access
  - |-
    machine:
      features:
        kubernetesTalosAPIAccess:
          enabled: true
          allowedRoles:
            - os:admin
          allowedKubernetesNamespaces:
            - actions-runner-system
            - system-upgrade
