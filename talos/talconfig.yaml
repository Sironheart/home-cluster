---
clusterName: home
# renovate: depName=ghcr.io/siderolabs/installer datasource=docker
talosVersion: v1.10.7
# renovate: depName=ghcr.io/siderolabs/kubelet datasource=docker
kubernetesVersion: v1.33.5

endpoint: https://internal.siron.casa:6443
allowSchedulingOnMasters: true
cniConfig:
  name: none

additionalMachineCertSans: &san
  - 127.0.0.1 #KubePrism
  - 192.168.0.11 #Talos01
  - 192.168.0.12 #Talos02
  - 192.168.0.13 #Talos03
  - internal.siron.casa #DNS route to cluster
additionalApiServerCertSans: *san

controlPlane:
  schematic:
    customization:
      extraKernelArgs:
        - -init_on_alloc
        - -init_on_free
        - -selinux
        - apparmor=0
        - init_on_alloc=0
        - init_on_free=0
        - mitigations=off
        - security=none
        - sysctl.kernel.kexec_load_disabled=1
        - talos.auditd.disabled=1
        - sysctl.vm.swappiness=1
        - sysctl.vm.dirty_ratio=5
        - sysctl.vm.dirty_background_ratio=2
        - sysctl.vm.vfs_cache_pressure=50
        - amd_pstate=active
      systemExtensions:
        officialExtensions:
          - siderolabs/amdgpu
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools

nodes:
  - hostname: talos01
    ipAddress: 192.168.0.11
    controlPlane: true
    disableSearchDomain: true

    installDisk: "/dev/nvme0n1"

    machineSpec: &machinespec
      mode: metal
      arch: amd64
      secureboot: false
      useUKI: false

    networkInterfaces: &network
      - deviceSelector:
          physical: true
        dhcp: true

    nodeLabels: &labels
      node.longhorn.io/create-default-disk: config
      feature.node.kubernetes.io/amd-gpu: "true"

    nodeAnnotations: &annotations
      node.longhorn.io/default-disks-config: '[{"path":"/var/mnt/longhorn","allowScheduling":true}]'

  - hostname: talos02
    ipAddress: 192.168.0.12
    controlPlane: true
    disableSearchDomain: true

    installDisk: "/dev/nvme0n1"

    machineSpec: *machinespec

    networkInterfaces: *network

    nodeLabels: *labels
    nodeAnnotations: *annotations

  - hostname: talos03
    ipAddress: 192.168.0.13
    controlPlane: true
    disableSearchDomain: true

    installDisk: "/dev/nvme0n1"

    machineSpec: *machinespec

    networkInterfaces: *network

    nodeLabels: *labels
    nodeAnnotations: *annotations

patches:
  # Disable search domain everywhere
  - |-
    machine:
      network:
        disableSearchDomain: true
        # interfaces:
        #   - deviceSelector:
        #       physical: true
        #     dhcp: true
        #     vip:
        #       ip: 192.168.0.10

  # Enable host dns
  - |-
    machine:
      features:
        apidCheckExtKeyUsage: true
        diskQuotaSupport: true
        hostDNS:
          enabled: true
          resolveMemberNames: true
          forwardKubeDNSToHost: false

  # Wipe disk on install
  - |-
    machine:
      install:
        wipe: true

  - |-
    apiVersion: v1alpha1
    kind: UserVolumeConfig
    name: longhorn
    provisioning:
      diskSelector:
        match: disk.transport == "nvme"
      minSize: 200G
      maxSize: 800G
      grow: true
    encryption:
      provider: luks2
      keys:
        - slot: 0
          tpm: {}

  # Replace kubeproxy with cilium
  - |-
    cluster:
      proxy:
        disabled: true

  # Kubelet configuration
  - |-
    machine:
      kubelet:
        disableManifestsDirectory: true
        extraConfig:
          maxPods: 250

  # Configure cluster
  - |-
    cluster:
      allowSchedulingOnControlPlanes: true
      controllerManager:
        extraArgs:
          bind-address: 0.0.0.0
      coreDNS:
          disabled: true
      proxy:
        disabled: true
      scheduler:
        config:
          apiVersion: kubescheduler.config.k8s.io/v1
          kind: KubeSchedulerConfiguration
          profiles:
            - schedulerName: default-scheduler
              pluginConfig:
                - name: PodTopologySpread
                  args:
                    defaultingType: List
                    defaultConstraints:
                      - maxSkew: 1
                        topologyKey: kubernetes.io/hostname
                        whenUnsatisfiable: ScheduleAnyway

  # Longhorn settings
  - |-
    cluster:
      network:
        podSubnets:
          - 10.244.0.0/16
        serviceSubnets:
          - 10.96.0.0/12
      apiServer:
        disablePodSecurityPolicy: true
        admissionControl:
        - name: PodSecurity
          configuration:
            apiVersion: pod-security.admission.config.k8s.io/v1alpha1
            kind: PodSecurityConfiguration
            defaults:
              audit: restricted
              audit-version: latest
              enforce: baseline
              enforce-version: latest
              warn: restricted
              warn-version: latest
            exemptions:
              namespaces:
                # - kube-system
                - longhorn-system
                - observability
                - network
              runtimeClasses: []
              usernames: []
        auditPolicy:
          apiVersion: audit.k8s.io/v1
          kind: Policy
          rules:
            - level: Metadata

  # Etcd metrics
  - |-
    cluster:
      etcd:
        extraArgs:
          listen-metrics-urls: http://0.0.0.0:2381

  # Enable K8s Talos API Access
  - |-
    machine:
      features:
        kubernetesTalosAPIAccess:
          enabled: true
          allowedRoles:
            - os:admin
          allowedKubernetesNamespaces:
            - actions-runner-system
            - system-upgrade
