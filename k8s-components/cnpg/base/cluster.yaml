---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${APP}-db
spec:
  instances: ${CNPG_REPLICAS:=2}
  imageName: ${CNPG_IMAGE:=ghcr.io/cloudnative-pg/postgresql}:${CNPG_VERSION}
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  managed:
    services:
      disabledDefaultServices: ${CNPG_DISABLED_SERVICES:=['ro', 'r']}
  storage:
    size: ${CNPG_SIZE:=2Gi}
    storageClass: ${CNPG_STORAGECLASS:=openebs-hostpath}
  resources:
    requests:
      cpu: ${CNPG_REQUESTS_CPU:=500m}
      memory: ${CNPG_REQUESTS_MEMORY:=${CNPG_LIMITS_MEMORY:=1Gi}}
    limits:
      memory: ${CNPG_LIMITS_MEMORY:=1Gi}
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    nodeSelector:
      kubernetes.io/arch: amd64
  monitoring:
    enablePodMonitor: true
