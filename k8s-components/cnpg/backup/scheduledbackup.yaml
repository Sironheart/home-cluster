---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: "postgres-${APP}-daily-backup"
  namespace: database
spec:
  immediate: true
  backupOwnerReference: self
  schedule: "@daily"
  cluster:
    name: "${APP}-db"
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
